name: Update football matches

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install requests

      - name: Collect football data
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          python .github/workflows/collector.py

      - name: Verify JSON files
        run: |
          echo "FILES:"
          ls -lh matches.json
          ls -lh teams.json
          ls -lh leagues.json
          ls -lh team_list.json
          ls -lh league_list.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json
          git add teams.json
          git add leagues.json
          git add team_list.json
          git add league_list.json

          git diff --cached --quiet || git commit -m "Update football data"

          git push origin main
