```yaml
name: Update football matches

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run collector
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          python .github/workflows/collector.py

      - name: Check generated files
        run: |
          echo "===== GENERATED FILES ====="
          ls -lh matches.json || true
          ls -lh teams.json || true
          ls -lh leagues.json || true
          ls -lh team_list.json || true
          ls -lh league_list.json || true

      - name: Commit updated football data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add matches.json teams.json leagues.json team_list.json league_list.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update football matches and data"
            git push
          fi
```
