<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Match Center</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f9;
    color: #172033;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

.header {
    background: linear-gradient(135deg,#101c36,#172b52);
    color: white;
    padding: 18px 15px;
    text-align: center;
}

.logo-title {
    font-size: 22px;
    font-weight: 800;
}

.subtitle {
    margin-top: 5px;
    color: #b8c6dc;
    font-size: 12px;
}

/* DATE NAVIGATION */

.date-nav {
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
}

.nav-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 10px;
    background: #172b52;
    color: white;
    font-size: 23px;
}

.date-box {
    text-align: center;
}

.date-day {
    font-size: 17px;
    font-weight: 800;
    text-transform: capitalize;
}

.date-number {
    margin-top: 3px;
    font-size: 12px;
    color: #69758a;
}

/* STATS */

.stats {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #eef1f5;
}

.stat {
    flex: 1;
    background: white;
    border-radius: 10px;
    padding: 10px 5px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 18px;
}

.stat span {
    font-size: 10px;
    color: #788397;
}

/* CONTENT */

.content {
    padding: 10px;
    max-width: 700px;
    margin: auto;
}

/* LEAGUE */

.league {
    margin-bottom: 15px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.league-header {
    background: #172b52;
    color: white;
    padding: 11px 13px;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
}

.league-count {
    margin-left: auto;
    background: rgba(255,255,255,.15);
    padding: 3px 7px;
    border-radius: 8px;
    font-size: 10px;
}

/* MATCH CARD */

.match {
    padding: 13px 8px;
    border-bottom: 1px solid #edf0f4;
}

.match:last-child {
    border-bottom: none;
}

.match-top {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
}

.match-time {
    font-size: 12px;
    font-weight: 700;
    color: #637086;
}

.match-body {
    display: grid;
    grid-template-columns: 1fr 65px 1fr;
    align-items: center;
    gap: 5px;
}

/* TEAM */

.team {
    text-align: center;
    min-width: 0;
}

.team-logo {
    width: 42px;
    height: 42px;
    margin: auto;
    border-radius: 50%;
    background: #eef2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #172b52;
    font-size: 11px;
    font-weight: 800;
    border: 1px solid #dce2ea;
}

.team-name {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    line-height: 1.2;
    word-break: break-word;
}

/* CENTER */

.center {
    text-align: center;
}

.score {
    font-size: 17px;
    font-weight: 900;
}

.vs {
    font-size: 12px;
    color: #8b96a8;
    font-weight: 700;
}

.status {
    display: inline-block;
    margin-top: 5px;
    padding: 3px 7px;
    border-radius: 8px;
    font-size: 9px;
    font-weight: 800;
}

.status.upcoming {
    background: #edf1f6;
    color: #647189;
}

.status.live {
    background: #ffe7e9;
    color: #c51e2c;
}

.status.finished {
    background: #e4f6eb;
    color: #198346;
}

/* EMPTY */

.empty {
    background: white;
    border-radius: 12px;
    padding: 50px 20px;
    text-align: center;
    color: #778398;
}

/* LOADING */

.loading {
    padding: 50px;
    text-align: center;
    color: #69778d;
}

/* FOOTER */

.footer {
    padding: 25px;
    text-align: center;
    color: #8994a6;
    font-size: 10px;
}

/* MOBILE */

@media(max-width:420px) {

    .team-name {
        font-size: 11px;
    }

    .team-logo {
        width: 38px;
        height: 38px;
    }

    .match-body {
        grid-template-columns: 1fr 55px 1fr;
    }

}

</style>
</head>


<body>


<header class="header">

    <div class="logo-title">
        ⚽ Football Match Center
    </div>

    <div class="subtitle">
        Fixtures • Live • Résultats
    </div>

</header>


<div class="date-nav">

    <button
        class="nav-btn"
        onclick="changeDay(-1)"
    >
        ←
    </button>


    <div class="date-box">

        <div
            id="dateDay"
            class="date-day"
        >
            Chargement...
        </div>

        <div
            id="dateNumber"
            class="date-number"
        >
        </div>

    </div>


    <button
        class="nav-btn"
        onclick="changeDay(1)"
    >
        →
    </button>

</div>


<div class="stats">

    <div class="stat">

        <strong id="total">
            0
        </strong>

        <span>
            MATCHS
        </span>

    </div>


    <div class="stat">

        <strong id="live">
            0
        </strong>

        <span>
            LIVE
        </span>

    </div>


    <div class="stat">

        <strong id="finished">
            0
        </strong>

        <span>
            TERMINÉS
        </span>

    </div>

</div>


<main
    id="content"
    class="content"
>

    <div class="loading">
        ⚽ Chargement...
    </div>

</main>


<div class="footer">
    Football Match Center
</div>


<script>

/* =====================================================
   DATA
===================================================== */

let matches = [];

let selectedDate = new Date();


const TZ =
    "Indian/Antananarivo";


/* =====================================================
   GET DATE MADAGASCAR
===================================================== */

function madagascarDate(value) {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: TZ,
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(
        new Date(value)
    );

}


/* =====================================================
   GET TIME
===================================================== */

function madagascarTime(value) {

    return new Intl.DateTimeFormat(
        "fr-FR",
        {
            timeZone: TZ,
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }
    ).format(
        new Date(value)
    );

}


/* =====================================================
   CURRENT SELECTED DATE
===================================================== */

function selectedDateString() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: TZ,
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(
        selectedDate
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function displayDate() {

    return selectedDate.toLocaleDateString(
        "fr-FR",
        {
            timeZone: TZ,
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );

}


/* =====================================================
   STATUS
===================================================== */

function statusName(status) {

    return String(status || "")
        .toLowerCase()
        .replace(/[\s_-]/g,"");

}


function getStatus(match) {

    const status =
        statusName(match.status);


    if (

        status === "live" ||
        status === "inprogress" ||
        status === "playing" ||
        status === "halftime"

    ) {

        return {

            name: "LIVE",

            className: "live"

        };

    }


    if (

        status === "finished" ||
        status === "finish" ||
        status === "completed" ||
        status === "complete"

    ) {

        return {

            name: "TERMINÉ",

            className: "finished"

        };

    }


    return {

        name: "À VENIR",

        className: "upcoming"

    };

}


/* =====================================================
   SCORE
===================================================== */

function getScore(match) {

    const status =
        statusName(match.status);


    /*
       NOT STARTED
       = NO SCORE
    */

    if (

        status === "notstarted" ||
        status === "scheduled" ||
        status === "upcoming"

    ) {

        return null;

    }


    const home =
        match.home_score;

    const away =
        match.away_score;


    if (

        home !== null &&
        home !== undefined &&
        away !== null &&
        away !== undefined

    ) {

        return `${home} - ${away}`;

    }


    return null;

}


/* =====================================================
   TEAM INITIALS
===================================================== */

function initials(name) {

    if (!name) {
        return "?";
    }


    const words =
        name
            .trim()
            .split(/\s+/);


    if (words.length === 1) {

        return words[0]
            .substring(0,3)
            .toUpperCase();

    }


    return (

        words[0][0] +
        words[1][0]

    ).toUpperCase();

}


/* =====================================================
   LEAGUE NAME
===================================================== */

const leagueNames = {

    34: "Brazil — Série B"

};


/*
   Raha mbola tsy misy mapping
   dia aseho ny League ID.
*/

function getLeagueName(match) {

    return (

        leagueNames[
            match.league_id
        ]

        ||

        match.league_name

        ||

        match.competition_name

        ||

        `Compétition #${match.league_id}`

    );

}


/* =====================================================
   CHANGE DAY
===================================================== */

function changeDay(number) {

    selectedDate.setDate(
        selectedDate.getDate() +
        number
    );

    render();

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const date =
        selectedDateString();


    /*
       DATE HEADER
    */

    document
        .getElementById("dateDay")
        .textContent =
        displayDate();


    document
        .getElementById("dateNumber")
        .textContent =
        date;


    /*
       FILTER EXACT DATE
    */

    const dayMatches =
        matches.filter(
            function(match) {

                if (!match.event_date) {

                    return false;

                }


                return (

                    madagascarDate(
                        match.event_date
                    )

                    ===

                    date

                );

            }
        );


    /*
       STATS
    */

    document
        .getElementById("total")
        .textContent =
        dayMatches.length;


    let liveCount = 0;

    let finishedCount = 0;


    dayMatches.forEach(
        function(match) {

            const status =
                statusName(
                    match.status
                );


            if (

                status === "live" ||
                status === "inprogress" ||
                status === "playing" ||
                status === "halftime"

            ) {

                liveCount++;

            }


            if (

                status === "finished" ||
                status === "finish" ||
                status === "completed" ||
                status === "complete"

            ) {

                finishedCount++;

            }

        }
    );


    document
        .getElementById("live")
        .textContent =
        liveCount;


    document
        .getElementById("finished")
        .textContent =
        finishedCount;


    const content =
        document.getElementById(
            "content"
        );


    /*
       NO MATCH
    */

    if (!dayMatches.length) {

        content.innerHTML = `

            <div class="empty">

                ⚽

                <br><br>

                Aucun match pour cette date.

            </div>

        `;

        return;

    }


    /*
       SORT BY TIME
    */

    dayMatches.sort(
        function(a,b) {

            return (

                new Date(a.event_date)

                -

                new Date(b.event_date)

            );

        }
    );


    /*
       GROUP LEAGUES
    */

    const leagues = {};


    dayMatches.forEach(
        function(match) {

            const league =
                getLeagueName(match);


            if (!leagues[league]) {

                leagues[league] = [];

            }


            leagues[league].push(
                match
            );

        }
    );


    /*
       BUILD
    */

    let html = "";


    Object.keys(leagues)
        .sort()
        .forEach(
            function(league) {

                html += `

                    <section class="league">

                        <div class="league-header">

                            🏆

                            <span>
                                ${league}
                            </span>

                            <span
                                class="league-count"
                            >
                                ${leagues[league].length}
                            </span>

                        </div>

                `;


                leagues[league].forEach(
                    function(match) {

                        const status =
                            getStatus(
                                match
                            );


                        const score =
                            getScore(
                                match
                            );


                        const home =
                            match.home_team ||
                            "Équipe";


                        const away =
                            match.away_team ||
                            "Équipe";


                        html += `

                            <div class="match">

                                <div class="match-top">

                                    <div class="match-time">

                                        🕐

                                        ${madagascarTime(
                                            match.event_date
                                        )}

                                    </div>

                                </div>


                                <div class="match-body">


                                    <div class="team">

                                        <div class="team-logo">

                                            ${initials(
                                                home
                                            )}

                                        </div>

                                        <div class="team-name">

                                            ${home}

                                        </div>

                                    </div>


                                    <div class="center">

                                        <div class="${
                                            score
                                            ? "score"
                                            : "vs"
                                        }">

                                            ${
                                                score
                                                || "VS"
                                            }

                                        </div>


                                        <div
                                            class="status ${
                                                status.className
                                            }"
                                        >

                                            ${
                                                status.name
                                            }

                                        </div>

                                    </div>


                                    <div class="team">

                                        <div class="team-logo">

                                            ${initials(
                                                away
                                            )}

                                        </div>

                                        <div class="team-name">

                                            ${away}

                                        </div>

                                    </div>


                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                    </section>

                `;

            }
        );


    content.innerHTML =
        html;

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadData() {

    const content =
        document.getElementById(
            "content"
        );


    try {

        const response =
            await fetch(
                "matches.json?nocache=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        matches =
            Array.isArray(
                data.matches
            )

            ? data.matches

            : [];


        selectedDate =
            new Date();


        render();


        console.log(
            "Matches:",
            matches.length
        );

    }

    catch(error) {

        console.error(error);


        content.innerHTML = `

            <div class="empty">

                ❌

                <br><br>

                Impossible de charger matches.json.

                <br><br>

                ${error.message}

            </div>

        `;

    }

}


/* =====================================================
   AUTO UPDATE
===================================================== */

setInterval(
    loadData,
    5 * 60 * 1000
);


/* =====================================================
   START
===================================================== */

loadData();

</script>

</body>
</html>
