<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Football Match Center</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f7fa;
  --white:#fff;
  --text:#172033;
  --muted:#7b8495;
  --border:#e6eaf0;
  --blue:#1769ff;
  --blue2:#edf4ff;
  --green:#16a34a;
  --greenbg:#eaf8ef;
  --red:#e53935;
  --redbg:#fff0f0;
  --orange:#f59e0b;
  --shadow:0 5px 22px rgba(25,40,70,.07);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button{font-family:inherit}

.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  padding:14px 16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:43px;
  height:43px;
  border-radius:12px;
  background:linear-gradient(135deg,#1769ff,#4c8cff);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.brand h1{
  font-size:18px;
  font-weight:800;
}

.brand p{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.status{
  max-width:1100px;
  margin:auto;
  padding:11px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.refresh{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff;
  color:var(--blue);
  font-size:20px;
  cursor:pointer;
}

.status-title{
  font-size:13px;
  font-weight:800;
}

.stat{
  background:#fff;
  border:1px solid var(--border);
  padding:7px 10px;
  border-radius:9px;
  font-size:11px;
  color:var(--muted);
}

.stat b{color:var(--text)}

.tabs-wrap{
  background:#fff;
  border-bottom:1px solid var(--border);
}

.tabs{
  max-width:1100px;
  margin:auto;
  padding:9px 16px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.tab{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:#fff;
  color:#667085;
  border-radius:10px;
  padding:9px 14px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.tab.active{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}

.main{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

.day{
  margin:8px 2px 10px;
  color:#667085;
  font-size:13px;
  font-weight:800;
  text-transform:capitalize;
}

.league{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.league-head{
  background:#fafbfc;
  border-bottom:1px solid var(--border);
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.league-title{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.trophy{
  width:32px;
  height:32px;
  background:#fff4d8;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.league-name{
  font-size:13px;
  font-weight:800;
}

.country{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.count{
  font-size:10px;
  color:var(--muted);
}

.match{
  padding:15px;
  border-bottom:1px solid var(--border);
}

.match:last-child{border-bottom:0}

.match-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.time{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.badge{
  padding:5px 8px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
}

.badge.live{
  background:var(--redbg);
  color:var(--red);
}

.badge.finished{
  background:var(--greenbg);
  color:var(--green);
}

.badge.upcoming{
  background:#f1f3f6;
  color:#667085;
}

.teams{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.team.home{
  justify-content:flex-end;
  text-align:right;
}

.team.away{
  justify-content:flex-start;
  text-align:left;
}

.team-name{
  font-size:12px;
  font-weight:800;
  line-height:1.25;
}

.logo{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  border:1px solid var(--border);
  background:#f4f6f9;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.center{
  text-align:center;
  color:#98a2b3;
  font-size:12px;
  font-weight:800;
}

.center.score{
  color:var(--text);
  font-size:21px;
}

.prediction{
  margin-top:14px;
  border:1px solid #dce8ff;
  border-radius:13px;
  overflow:hidden;
  background:#f8fbff;
}

.pred-head{
  background:#edf4ff;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.pred-title{
  color:#1769ff;
  font-size:11px;
  font-weight:900;
}

.conf{
  color:#315ea8;
  font-size:10px;
  font-weight:800;
}

.pred-body{
  padding:11px;
}

.main-pred{
  background:#fff;
  border:1px solid #e1e9f7;
  border-radius:9px;
  padding:10px;
  margin-bottom:9px;
}

.main-label{
  color:#98a2b3;
  font-size:8px;
  font-weight:900;
}

.main-value{
  color:#174ea6;
  font-size:14px;
  font-weight:900;
  margin-top:4px;
}

.pred-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.pred-item{
  background:#fff;
  border:1px solid #e5eaf2;
  border-radius:9px;
  padding:8px;
}

.pred-item span{
  display:block;
  color:#98a2b3;
  font-size:8px;
  font-weight:900;
  margin-bottom:4px;
}

.pred-item b{
  font-size:10px;
  line-height:1.3;
}

.analysis{
  margin-top:8px;
  background:#fff;
  border:1px solid #e5eaf2;
  border-radius:9px;
  padding:9px;
  font-size:10px;
  line-height:1.45;
  color:#667085;
}

.analysis strong{
  color:#344054;
}

.loading,
.empty,
.error{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

.error{color:var(--red)}

.footer{
  text-align:center;
  color:#98a2b3;
  font-size:10px;
  padding:20px;
}

@media(max-width:600px){

  .main{padding:11px}

  .status{
    padding:10px 12px;
  }

  .teams{
    grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);
  }

  .team-name{
    font-size:11px;
  }

  .logo{
    width:34px;
    height:34px;
    min-width:34px;
  }

  .center.score{
    font-size:19px;
  }

  .pred-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:370px){

  .pred-grid{
    grid-template-columns:1fr;
  }

  .teams{
    grid-template-columns:minmax(0,1fr) 50px minmax(0,1fr);
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">⚽</div>
      <div>
        <h1>Football Match Center</h1>
        <p>Scores • Live • Résultats • Prédictions</p>
      </div>
    </div>
  </div>
</header>

<div id="status" class="status">
  <button class="refresh" onclick="location.reload()">↻</button>
  <div class="status-title">Chargement...</div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" data-filter="all">Tous</button>
    <button class="tab" data-filter="live">🔴 Live</button>
    <button class="tab" data-filter="upcoming">🕐 À venir</button>
    <button class="tab" data-filter="finished">✓ Terminés</button>
  </div>
</div>

<main class="main">
  <div id="matches">
    <div class="loading">Chargement des matchs...</div>
  </div>
</main>

<footer class="footer">
  Football Match Center
</footer>

<script>

"use strict";

let matches=[];
let currentFilter="all";

/* =========================
   BASIC HELPERS
========================= */

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function validNumber(v){
  return v !== null &&
         v !== undefined &&
         v !== "" &&
         Number.isFinite(Number(v));
}

function average(arr){
  if(!arr.length) return null;
  return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function initials(name){
  return String(name||"FC")
    .trim()
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function logo(name){
  return `<div class="logo">${esc(initials(name))}</div>`;
}

/* =========================
   STATUS
========================= */

function getStatus(m){

  const s=String(
    m.status ||
    m.match_status ||
    ""
  ).toLowerCase();

  if(
    s==="finished" ||
    s==="completed" ||
    s==="terminated" ||
    s==="ended"
  ) return "finished";

  if(
    s==="live" ||
    s==="inplay" ||
    s==="in_play" ||
    s==="playing" ||
    s==="progress"
  ) return "live";

  if(
    String(m.period||"").toLowerCase()==="ft"
  ) return "finished";

  if(
    m.is_live===true ||
    m.live===true
  ) return "live";

  return "upcoming";
}

/* =========================
   SCORE
========================= */

function getScore(m){

  let h=m.home_score;
  let a=m.away_score;

  if(!validNumber(h) || !validNumber(a)){

    if(m.score){

      if(validNumber(m.score.home))
        h=m.score.home;

      if(validNumber(m.score.away))
        a=m.score.away;

      if(m.score.fullTime){

        if(!validNumber(h) &&
           validNumber(m.score.fullTime.home))
          h=m.score.fullTime.home;

        if(!validNumber(a) &&
           validNumber(m.score.fullTime.away))
          a=m.score.fullTime.away;
      }
    }
  }

  return {
    home:validNumber(h)?Number(h):null,
    away:validNumber(a)?Number(a):null
  };
}

/* =========================
   H2H / RECENT ANALYSIS
========================= */

function getH2H(m){

  const h=m.head_to_head;

  if(!h || !Array.isArray(h.recent_matches))
    return null;

  const homeId=String(m.home_team_id);
  const awayId=String(m.away_team_id);

  const games=h.recent_matches
    .filter(x=>{
      return (
        String(x.home_team_id)===homeId &&
        String(x.away_team_id)===awayId
      ) ||
      (
        String(x.home_team_id)===awayId &&
        String(x.away_team_id)===homeId
      );
    })
    .slice(0,10);

  if(!games.length)
    return null;

  let homeGoals=[];
  let awayGoals=[];
  let totalGoals=[];
  let homeWins=0;
  let awayWins=0;
  let draws=0;
  let btts=0;
  let over25=0;

  games.forEach(g=>{

    const gh=Number(g.home_score);
    const ga=Number(g.away_score);

    if(!Number.isFinite(gh) ||
       !Number.isFinite(ga))
      return;

    const homeIsActual =
      String(g.home_team_id)===homeId;

    const ourHome=
      homeIsActual ? gh : ga;

    const ourAway=
      homeIsActual ? ga : gh;

    homeGoals.push(ourHome);
    awayGoals.push(ourAway);

    totalGoals.push(gh+ga);

    if(ourHome>ourAway) homeWins++;
    else if(ourAway>ourHome) awayWins++;
    else draws++;

    if(ourHome>0 && ourAway>0)
      btts++;

    if(gh+ga>2.5)
      over25++;
  });

  if(!homeGoals.length)
    return null;

  return {
    games:homeGoals.length,
    homeAvg:average(homeGoals),
    awayAvg:average(awayGoals),
    totalAvg:average(totalGoals),
    homeWins,
    awayWins,
    draws,
    bttsRate:btts/homeGoals.length,
    over25Rate:over25/homeGoals.length
  };
}

/* =========================
   TEAM-SPECIFIC RECENT FORM
========================= */

function getTeamForm(m){

  const all=[];

  /*
   * H2H data is the data available
   * in the current matches.json.
   */

  const recent=m.head_to_head?.recent_matches;

  if(!Array.isArray(recent))
    return null;

  const homeId=String(m.home_team_id);
  const awayId=String(m.away_team_id);

  recent.forEach(g=>{

    const gh=Number(g.home_score);
    const ga=Number(g.away_score);

    if(!Number.isFinite(gh) ||
       !Number.isFinite(ga))
      return;

    const homeTeam=String(g.home_team_id);
    const awayTeam=String(g.away_team_id);

    if(homeTeam===homeId){

      all.push({
        team:"home",
        gf:gh,
        ga:ga,
        win:gh>ga,
        draw:gh===ga
      });

    }else if(awayTeam===homeId){

      all.push({
        team:"home",
        gf:ga,
        ga:gh,
        win:ga>gh,
        draw:ga===gh
      });

    }else if(homeTeam===awayId){

      all.push({
        team:"away",
        gf:gh,
        ga:ga,
        win:gh>ga,
        draw:gh===ga
      });

    }else if(awayTeam===awayId){

      all.push({
        team:"away",
        gf:ga,
        ga:gh,
        win:ga>gh,
        draw:ga===gh
      });
    }
  });

  const home=all.filter(x=>x.team==="home");
  const away=all.filter(x=>x.team==="away");

  return {
    homeGF:average(home.map(x=>x.gf)),
    homeGA:average(home.map(x=>x.ga)),
    homeWins:home.filter(x=>x.win).length,
    homeGames:home.length,

    awayGF:average(away.map(x=>x.gf)),
    awayGA:average(away.map(x=>x.ga)),
    awayWins:away.filter(x=>x.win).length,
    awayGames:away.length
  };
}

/* =========================
   MAIN PREDICTION ENGINE
========================= */

function analyse(m){

  const h2h=getH2H(m);
  const form=getTeamForm(m);

  /*
   * No statistics -> don't invent.
   */

  if(!h2h){

    return {
      available:false,
      confidence:null,
      main:"Analyse insuffisante",
      dc:"—",
      ou:"—",
      btts:"—",
      score:"—",
      text:"Pas assez de données historiques disponibles pour produire une analyse fiable."
    };
  }

  const total=h2h.games;

  /*
   * Base probabilities from H2H.
   */

  let pHome=(h2h.homeWins/total);
  let pDraw=(h2h.draws/total);
  let pAway=(h2h.awayWins/total);

  /*
   * Add a home advantage only when
   * the historical sample is small.
   */

  if(total<5){
    pHome+=0.05;
    pAway-=0.025;
    pDraw-=0.025;
  }

  /*
   * Recent form adjustment.
   */

  if(form){

    if(
      form.homeGames>0 &&
      form.awayGames>0
    ){

      const homeForm=
        form.homeWins/form.homeGames;

      const awayForm=
        form.awayWins/form.awayGames;

      const diff=homeForm-awayForm;

      pHome += diff*0.15;
      pAway -= diff*0.15;
    }
  }

  pHome=clamp(pHome,0.05,0.90);
  pDraw=clamp(pDraw,0.05,0.60);
  pAway=clamp(pAway,0.05,0.90);

  const sum=pHome+pDraw+pAway;

  pHome/=sum;
  pDraw/=sum;
  pAway/=sum;

  /*
   * Goals model.
   */

  let homeGoals=h2h.homeAvg;
  let awayGoals=h2h.awayAvg;

  if(form){

    if(validNumber(form.homeGF)){
      homeGoals =
        (homeGoals*0.65) +
        (form.homeGF*0.35);
    }

    if(validNumber(form.awayGF)){
      awayGoals =
        (awayGoals*0.65) +
        (form.awayGF*0.35);
    }
  }

  homeGoals=clamp(homeGoals,0.20,4.50);
  awayGoals=clamp(awayGoals,0.20,4.50);

  /*
   * Score probable.
   */

  const predictedHome=
    clamp(Math.round(homeGoals),0,5);

  const predictedAway=
    clamp(Math.round(awayGoals),0,5);

  /*
   * Main prediction.
   */

  let main;

  if(pHome>=pDraw && pHome>=pAway){

    main=
      "1 - Victoire " +
      m.home_team;

  }else if(pAway>=pHome && pAway>=pDraw){

    main=
      "2 - Victoire " +
      m.away_team;

  }else{

    main="X - Match nul";
  }

  /*
   * Double chance.
   */

  let dc;

  if(pHome>=pAway)
    dc="1X";
  else
    dc="X2";

  /*
   * Goals markets.
   */

  const avgGoals=homeGoals+awayGoals;

  const over25 =
    avgGoals>=2.55 ||
    h2h.over25Rate>=0.58;

  const ou=
    over25 ? "Over 2.5" : "Under 2.5";

  const btts =
    h2h.bttsRate>=0.55
      ? "Oui"
      : "Non";

  /*
   * Confidence based on sample size
   * and probability separation.
   */

  const strongest=
    Math.max(pHome,pDraw,pAway);

  let confidence=
    50 +
    (strongest-0.34)*70;

  if(total>=5)
    confidence+=4;

  if(total>=8)
    confidence+=3;

  confidence=
    Math.round(
      clamp(confidence,50,89)
    );

  /*
   * Human-readable analysis.
   */

  let text=
    `${total} confrontation(s) analysée(s). `;

  text+=
    `Moyenne buts: ${h2h.totalAvg.toFixed(2)}. `;

  text+=
    `${m.home_team}: ${Math.round(pHome*100)}% ` +
    `• Nul: ${Math.round(pDraw*100)}% ` +
    `• ${m.away_team}: ${Math.round(pAway*100)}%. `;

  if(h2h.bttsRate>=0.55){

    text+=
      `Les deux équipes ont marqué dans ` +
      `${Math.round(h2h.bttsRate*100)}% des H2H. `;

  }else{

    text+=
      `BTTS observé dans ` +
      `${Math.round(h2h.bttsRate*100)}% des H2H. `;
  }

  return {
    available:true,
    confidence,
    main,
    dc,
    ou,
    btts,
    score:`${predictedHome} - ${predictedAway}`,
    text
  };
}

/* =========================
   DATE
========================= */

function formatTime(date){

  return new Intl.DateTimeFormat(
    "fr-FR",
    {
      timeZone:"Indian/Antananarivo",
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }
  ).format(date);
}

function formatDate(date){

  return new Intl.DateTimeFormat(
    "fr-FR",
    {
      timeZone:"Indian/Antananarivo",
      weekday:"long",
      day:"2-digit",
      month:"long",
      year:"numeric"
    }
  ).format(date);
}

/* =========================
   RENDER MATCH
========================= */

function renderMatch(m){

  const status=getStatus(m);
  const score=getScore(m);

  const home=m.home_team || "Équipe domicile";
  const away=m.away_team || "Équipe extérieur";

  const date=new Date(m.event_date);

  let badge="";
  let badgeClass="upcoming";

  if(status==="live"){
    badge="🔴 LIVE";
    badgeClass="live";
  }
  else if(status==="finished"){
    badge="✓ Terminé";
    badgeClass="finished";
  }
  else{
    badge="🕐 À venir";
  }

  let center="VS";

  if(status!=="upcoming"){

    if(
      score.home!==null &&
      score.away!==null
    ){

      center=
        `${score.home} - ${score.away}`;

    }else{

      center="—";
    }
  }

  let prediction="";

  /*
   * Only analyse upcoming/live.
   * Finished matches show the actual result.
   */

  if(
    status==="upcoming" ||
    status==="live"
  ){

    const p=analyse(m);

    if(p.available){

      prediction=`
        <div class="prediction">

          <div class="pred-head">
            <div class="pred-title">
              🔮 ANALYSE & PRÉDICTION
            </div>

            <div class="conf">
              ${p.confidence}% confiance
            </div>
          </div>

          <div class="pred-body">

            <div class="main-pred">

              <div class="main-label">
                PRONOSTIC PRINCIPAL
              </div>

              <div class="main-value">
                ${esc(p.main)}
              </div>

            </div>

            <div class="pred-grid">

              <div class="pred-item">
                <span>DOUBLE CHANCE</span>
                <b>${esc(p.dc)}</b>
              </div>

              <div class="pred-item">
                <span>TOTAL BUTS</span>
                <b>${esc(p.ou)}</b>
              </div>

              <div class="pred-item">
                <span>BTTS</span>
                <b>${esc(p.btts)}</b>
              </div>

              <div class="pred-item">
                <span>SCORE PROBABLE</span>
                <b>${esc(p.score)}</b>
              </div>

            </div>

            <div class="analysis">
              <strong>Analyse :</strong>
              ${esc(p.text)}
            </div>

          </div>
        </div>
      `;

    }else{

      prediction=`
        <div class="prediction">

          <div class="pred-head">
            <div class="pred-title">
              🔮 ANALYSE
            </div>

            <div class="conf">
              Données limitées
            </div>
          </div>

          <div class="pred-body">

            <div class="analysis">
              ${esc(p.text)}
            </div>

          </div>
        </div>
      `;
    }
  }

  return `
    <article class="match">

      <div class="match-top">

        <div class="time">
          ${
            Number.isNaN(date.getTime())
              ? "--:--"
              : formatTime(date)
          }
        </div>

        <div class="badge ${badgeClass}">
          ${badge}
        </div>

      </div>

      <div class="teams">

        <div class="team home">

          <div class="team-name">
            ${esc(home)}
          </div>

          ${logo(home)}

        </div>

        <div class="center ${
          status!=="upcoming" ? "score" : ""
        }">
          ${center}
        </div>

        <div class="team away">

          ${logo(away)}

          <div class="team-name">
            ${esc(away)}
          </div>

        </div>

      </div>

      ${prediction}

    </article>
  `;
}

/* =========================
   RENDER ALL
========================= */

function render(){

  const box=
    document.getElementById("matches");

  let list=matches.filter(m=>{

    if(currentFilter==="all")
      return true;

    return getStatus(m)===currentFilter;
  });

  if(!list.length){

    box.innerHTML=`
      <div class="empty">
        Aucun match disponible.
      </div>
    `;

    return;
  }

  const days={};

  list.forEach(m=>{

    const d=new Date(m.event_date);

    if(Number.isNaN(d.getTime()))
      return;

    const key=
      d.toLocaleDateString(
        "en-CA",
        {timeZone:"Indian/Antananarivo"}
      );

    if(!days[key])
      days[key]=[];

    days[key].push(m);
  });

  let html="";

  Object.keys(days)
    .sort()
    .forEach(day=>{

      const arr=days[day];

      html+=`
        <div class="day">
          ${esc(formatDate(
            new Date(arr[0].event_date)
          ))}
        </div>
      `;

      const leagues={};

      arr.forEach(m=>{

        const id=
          String(m.league_id ?? "unknown");

        if(!leagues[id])
          leagues[id]=[];

        leagues[id].push(m);
      });

      Object.keys(leagues).forEach(id=>{

        const group=leagues[id];

        const leagueName=
          group[0].league_name ||
          group[0].competition ||
          `League ${id}`;

        html+=`
          <section class="league">

            <div class="league-head">

              <div class="league-title">

                <div class="trophy">🏆</div>

                <div>
                  <div class="league-name">
                    ${esc(leagueName)}
                  </div>

                  <div class="country">
                    Football
                  </div>
                </div>

              </div>

              <div class="count">
                ${group.length}
                match${group.length>1?"s":""}
              </div>

            </div>
        `;

        group.forEach(m=>{
          html+=renderMatch(m);
        });

        html+=`</section>`;
      });
    });

  box.innerHTML=html;
}

/* =========================
   STATUS BAR
========================= */

function updateStatus(){

  const live=
    matches.filter(
      m=>getStatus(m)==="live"
    ).length;

  const upcoming=
    matches.filter(
      m=>getStatus(m)==="upcoming"
    ).length;

  const finished=
    matches.filter(
      m=>getStatus(m)==="finished"
    ).length;

  document.getElementById("status").innerHTML=`

    <button
      class="refresh"
      onclick="location.reload()">
      ↻
    </button>

    <div class="status-title">
      ${matches.length} matchs
    </div>

    <div class="stat">
      🔴 Live <b>${live}</b>
    </div>

    <div class="stat">
      🕐 À venir <b>${upcoming}</b>
    </div>

    <div class="stat">
      ✓ Terminés <b>${finished}</b>
    </div>
  `;
}

/* =========================
   LOAD DATA
========================= */

async function load(){

  const box=
    document.getElementById("matches");

  try{

    const response=
      await fetch(
        "matches.json?v="+Date.now(),
        {
          cache:"no-store"
        }
      );

    if(!response.ok)
      throw new Error(
        "HTTP "+response.status
      );

    const data=
      await response.json();

    matches=
      Array.isArray(data)
        ? data
        : (data.matches || []);

    updateStatus();
    render();

  }catch(error){

    console.error(error);

    box.innerHTML=`
      <div class="error">
        Impossible de charger matches.json.
        <br><br>
        <button
          class="tab"
          onclick="location.reload()">
          Réessayer
        </button>
      </div>
    `;
  }
}

/* =========================
   FILTER BUTTONS
========================= */

document
  .querySelectorAll(".tab")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".tab")
          .forEach(x=>
            x.classList.remove("active")
          );

        btn.classList.add("active");

        currentFilter=
          btn.dataset.filter;

        render();
      }
    );
  });

/* =========================
   START
========================= */

load();

/*
 * Auto refresh every 5 minutes.
 */
setInterval(
  ()=>location.reload(),
  5*60*1000
);

</script>

</body>
</html>
