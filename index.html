<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Match Center</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #f3f5f8;
    color: #172033;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

/* HEADER */

.header {
    background: linear-gradient(135deg, #071b36, #123b69);
    color: #fff;
    padding: 18px 14px 16px;
}

.header-inner {
    max-width: 760px;
    margin: auto;
}

.title {
    font-size: 21px;
    font-weight: 800;
}

.subtitle {
    margin-top: 4px;
    color: #b8c8da;
    font-size: 12px;
}

/* DATE */

.date-bar {
    position: sticky;
    top: 0;
    z-index: 100;

    background: #fff;

    display: grid;
    grid-template-columns: 44px 1fr 44px;

    align-items: center;

    padding: 9px 10px;

    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.date-button {
    width: 42px;
    height: 42px;

    border: 0;
    border-radius: 11px;

    background: #123b69;
    color: white;

    font-size: 22px;
    font-weight: bold;
}

.date-button:active {
    transform: scale(.95);
}

.date-center {
    text-align: center;
}

.date-weekday {
    font-size: 16px;
    font-weight: 800;
    text-transform: capitalize;
}

.date-full {
    margin-top: 3px;
    color: #7b8798;
    font-size: 11px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 8px;

    max-width: 760px;
    margin: auto;

    padding: 10px;
}

.stat {
    background: white;
    border-radius: 12px;

    padding: 10px 5px;

    text-align: center;

    box-shadow: 0 1px 5px rgba(0,0,0,.05);
}

.stat-number {
    font-size: 19px;
    font-weight: 800;
}

.stat-label {
    margin-top: 3px;

    color: #7a8799;

    font-size: 9px;
    font-weight: 700;
}

/* CONTENT */

.content {
    width: 100%;
    max-width: 760px;

    margin: auto;

    padding: 0 10px 30px;
}

/* LEAGUE */

.league {
    background: #fff;

    border-radius: 13px;

    overflow: hidden;

    margin-bottom: 13px;

    box-shadow: 0 2px 9px rgba(0,0,0,.07);
}

.league-header {
    background: #102f55;
    color: #fff;

    min-height: 45px;

    display: flex;
    align-items: center;

    gap: 9px;

    padding: 9px 12px;
}

.league-icon {
    width: 28px;
    height: 28px;

    border-radius: 8px;

    background: rgba(255,255,255,.13);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 15px;
}

.league-info {
    min-width: 0;
    flex: 1;
}

.league-name {
    font-size: 13px;
    font-weight: 800;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.league-meta {
    margin-top: 2px;

    color: #b9c8d9;

    font-size: 9px;
}

.league-count {
    flex-shrink: 0;

    padding: 4px 7px;

    background: rgba(255,255,255,.12);

    border-radius: 8px;

    font-size: 9px;
}

/* MATCH */

.match {
    border-bottom: 1px solid #edf0f4;

    padding: 11px 8px 13px;
}

.match:last-child {
    border-bottom: 0;
}

.match-time {
    text-align: center;

    color: #68778c;

    font-size: 11px;
    font-weight: 700;

    margin-bottom: 8px;
}

.match-grid {
    display: grid;

    grid-template-columns: minmax(0,1fr) 74px minmax(0,1fr);

    align-items: center;

    gap: 5px;
}

.team {
    min-width: 0;

    text-align: center;
}

.team-logo {
    width: 44px;
    height: 44px;

    margin: auto;

    border-radius: 50%;

    object-fit: contain;

    background: #f4f6f9;

    border: 1px solid #e1e6ed;
}

.team-fallback {
    width: 44px;
    height: 44px;

    margin: auto;

    border-radius: 50%;

    background: #eef2f7;

    border: 1px solid #dce3ec;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #17375f;

    font-size: 11px;
    font-weight: 900;
}

.team-name {
    margin-top: 6px;

    font-size: 11px;
    line-height: 1.25;

    font-weight: 700;

    overflow-wrap: anywhere;
}

.match-center {
    text-align: center;
}

.score {
    font-size: 18px;
    font-weight: 900;
}

.vs {
    color: #7c8899;

    font-size: 12px;
    font-weight: 800;
}

.status {
    display: inline-block;

    margin-top: 5px;

    padding: 4px 7px;

    border-radius: 8px;

    font-size: 8px;
    font-weight: 900;
}

.status-upcoming {
    background: #edf1f6;
    color: #64738a;
}

.status-live {
    background: #ffe6e8;
    color: #c51f2d;
}

.status-finished {
    background: #e4f6eb;
    color: #198346;
}

/* EMPTY */

.empty {
    background: white;

    border-radius: 13px;

    padding: 55px 20px;

    text-align: center;

    color: #78869a;

    box-shadow: 0 2px 9px rgba(0,0,0,.06);
}

.empty-icon {
    font-size: 35px;
    margin-bottom: 10px;
}

/* LOADING */

.loading {
    padding: 60px 20px;

    text-align: center;

    color: #718095;
}

/* FOOTER */

.footer {
    padding: 20px;

    text-align: center;

    color: #8a95a6;

    font-size: 9px;
}

/* MOBILE */

@media (max-width: 380px) {

    .title {
        font-size: 19px;
    }

    .match-grid {
        grid-template-columns: minmax(0,1fr) 64px minmax(0,1fr);
    }

    .team-logo,
    .team-fallback {
        width: 39px;
        height: 39px;
    }

    .team-name {
        font-size: 10px;
    }

}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="title">⚽ Football Match Center</div>
        <div class="subtitle">
            Fixtures • Live • Résultats
        </div>
    </div>
</header>


<div class="date-bar">

    <button
        class="date-button"
        onclick="changeDay(-1)"
    >
        ‹
    </button>

    <div class="date-center">

        <div
            id="dateWeekday"
            class="date-weekday"
        >
            Chargement...
        </div>

        <div
            id="dateFull"
            class="date-full"
        >
        </div>

    </div>

    <button
        class="date-button"
        onclick="changeDay(1)"
    >
        ›
    </button>

</div>


<div class="stats">

    <div class="stat">
        <div
            id="totalMatches"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            MATCHS
        </div>
    </div>

    <div class="stat">
        <div
            id="liveMatches"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            LIVE
        </div>
    </div>

    <div class="stat">
        <div
            id="finishedMatches"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            TERMINÉS
        </div>
    </div>

</div>


<main
    id="content"
    class="content"
>
    <div class="loading">
        ⚽ Chargement des matchs...
    </div>
</main>


<div class="footer">
    Football Match Center
</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const TIMEZONE = "Indian/Antananarivo";

let matches = [];

let teams = {};

let leagues = {};

let selectedDate = new Date();


/* =====================================================
   DATE HELPERS
===================================================== */

function dateInMadagascar(value) {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: TIMEZONE,

            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(new Date(value));

}


function timeInMadagascar(value) {

    return new Intl.DateTimeFormat(
        "fr-FR",
        {
            timeZone: TIMEZONE,

            hour: "2-digit",
            minute: "2-digit",

            hour12: false
        }
    ).format(new Date(value));

}


function selectedDateString() {

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: TIMEZONE,

            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(selectedDate);

}


function showSelectedDate() {

    const text =
        new Intl.DateTimeFormat(
            "fr-FR",
            {
                timeZone: TIMEZONE,

                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        ).format(selectedDate);


    document.getElementById(
        "dateWeekday"
    ).textContent = text;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

    return String(value ?? "")

        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =====================================================
   GET OBJECT BY ID
===================================================== */

function findById(source, id) {

    if (!source || id == null) {
        return null;
    }


    const key = String(id);


    if (
        !Array.isArray(source) &&
        typeof source === "object"
    ) {

        if (source[key]) {
            return source[key];
        }

    }


    const list =
        Array.isArray(source)

        ? source

        : (
            source.results ||
            source.data ||
            source.teams ||
            source.leagues ||
            []
        );


    if (!Array.isArray(list)) {
        return null;
    }


    return list.find(
        item =>
            String(
                item.id ??
                item.team_id ??
                item.league_id
            ) === key
    ) || null;

}


/* =====================================================
   TEAM DATA
===================================================== */

function getTeam(match, side) {

    const id =
        side === "home"

        ? match.home_team_id

        : match.away_team_id;


    const name =
        side === "home"

        ? match.home_team

        : match.away_team;


    return (
        findById(teams, id)
        || {
            id: id,
            name: name
        }
    );

}


/* =====================================================
   TEAM NAME
===================================================== */

function getTeamName(match, side) {

    const team =
        getTeam(match, side);


    return (

        team?.name

        ||

        team?.team_name

        ||

        (
            side === "home"

            ? match.home_team

            : match.away_team
        )

        ||

        "Équipe"

    );

}


/* =====================================================
   LOGO URL
===================================================== */

function getLogo(team) {

    if (!team) {
        return null;
    }


    return (

        team.logo_url

        ||

        team.logo

        ||

        team.image_url

        ||

        team.image

        ||

        team.crest

        ||

        team.badge

        ||

        team.team_logo

        ||

        team.logo_path

        ||

        null

    );

}


/* =====================================================
   INITIALS
===================================================== */

function initials(name) {

    const value =
        String(name || "").trim();


    if (!value) {
        return "?";
    }


    const words =
        value.split(/\s+/);


    if (words.length === 1) {

        return value
            .substring(0,3)
            .toUpperCase();

    }


    return (

        words[0].charAt(0) +
        words[1].charAt(0)

    ).toUpperCase();

}


/* =====================================================
   LEAGUE
===================================================== */

function getLeague(match) {

    const id =
        match.league_id;


    const league =
        findById(leagues, id);


    return {

        name:

            league?.name

            ||

            league?.league_name

            ||

            league?.competition_name

            ||

            match.league_name

            ||

            match.competition_name

            ||

            `Compétition #${id ?? "?"}`,

        logo:

            league?.logo_url

            ||

            league?.logo

            ||

            league?.image_url

            ||

            league?.image

            ||

            league?.badge

            ||

            null

    };

}


/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(value) {

    return String(value || "")
        .toLowerCase()
        .replace(/[\s_-]/g, "");

}


function getStatus(match) {

    const status =
        normalizeStatus(match.status);


    if (

        status === "live" ||
        status === "inprogress" ||
        status === "playing" ||
        status === "halftime"

    ) {

        return {
            text: "LIVE",
            className: "status-live"
        };

    }


    if (

        status === "finished" ||
        status === "finish" ||
        status === "completed" ||
        status === "complete"

    ) {

        return {
            text: "TERMINÉ",
            className: "status-finished"
        };

    }


    return {
        text: "À VENIR",
        className: "status-upcoming"
    };

}


/* =====================================================
   SCORE
===================================================== */

function getScore(match) {

    const status =
        normalizeStatus(match.status);


    if (

        status === "notstarted" ||
        status === "scheduled" ||
        status === "upcoming" ||
        status === "created"

    ) {

        return null;

    }


    const home =
        match.home_score;


    const away =
        match.away_score;


    if (

        home !== null &&
        home !== undefined &&

        away !== null &&
        away !== undefined

    ) {

        return `${home} - ${away}`;

    }


    return null;

}


/* =====================================================
   CHANGE DATE
===================================================== */

function changeDay(amount) {

    selectedDate.setDate(
        selectedDate.getDate() + amount
    );

    render();

}


/* =====================================================
   LOGO HTML
===================================================== */

function teamLogoHtml(team, name) {

    const logo =
        getLogo(team);


    if (logo) {

        return `

            <img
                class="team-logo"
                src="${escapeHtml(logo)}"
                alt="${escapeHtml(name)}"
                loading="lazy"
                onerror="this.outerHTML='<div class=&quot;team-fallback&quot;>${escapeHtml(initials(name))}</div>'"
            >

        `;

    }


    return `

        <div class="team-fallback">

            ${escapeHtml(
                initials(name)
            )}

        </div>

    `;

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    showSelectedDate();


    document.getElementById(
        "dateFull"
    ).textContent =
        selectedDateString();


    const selected =
        selectedDateString();


    /*
       IMPORTANT:
       event_date is the ONLY date reference.
    */

    const dayMatches =
        matches.filter(
            match => {

                if (!match.event_date) {
                    return false;
                }


                return (
                    dateInMadagascar(
                        match.event_date
                    ) === selected
                );

            }
        );


    /*
       SORT
    */

    dayMatches.sort(
        (a,b) => {

            return (
                new Date(a.event_date)
                -
                new Date(b.event_date)
            );

        }
    );


    /*
       STATS
    */

    document.getElementById(
        "totalMatches"
    ).textContent =
        dayMatches.length;


    let live = 0;

    let finished = 0;


    dayMatches.forEach(
        match => {

            const s =
                normalizeStatus(
                    match.status
                );


            if (

                s === "live" ||
                s === "inprogress" ||
                s === "playing" ||
                s === "halftime"

            ) {

                live++;

            }


            if (

                s === "finished" ||
                s === "finish" ||
                s === "completed" ||
                s === "complete"

            ) {

                finished++;

            }

        }
    );


    document.getElementById(
        "liveMatches"
    ).textContent = live;


    document.getElementById(
        "finishedMatches"
    ).textContent = finished;


    const content =
        document.getElementById(
            "content"
        );


    if (!dayMatches.length) {

        content.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚽
                </div>

                Aucun match pour cette date.

            </div>

        `;

        return;

    }


    /*
       GROUP BY LEAGUE
    */

    const groups = {};


    dayMatches.forEach(
        match => {

            const league =
                getLeague(match);


            const key =
                String(
                    match.league_id ??
                    league.name
                );


            if (!groups[key]) {

                groups[key] = {

                    league: league,

                    matches: []

                };

            }


            groups[key].matches.push(
                match
            );

        }
    );


    let html = "";


    Object.values(groups)
        .forEach(group => {

            const league =
                group.league;


            let leagueLogo = "";


            if (league.logo) {

                leagueLogo = `

                    <img
                        src="${escapeHtml(league.logo)}"
                        style="
                            width:28px;
                            height:28px;
                            object-fit:contain;
                            border-radius:7px;
                            background:white;
                        "
                    >

                `;

            } else {

                leagueLogo = `

                    <div class="league-icon">
                        🏆
                    </div>

                `;

            }


            html += `

                <section class="league">

                    <div class="league-header">

                        ${leagueLogo}

                        <div class="league-info">

                            <div class="league-name">

                                ${escapeHtml(
                                    league.name
                                )}

                            </div>

                            <div class="league-meta">

                                ${group.matches.length}
                                match${
                                    group.matches.length > 1
                                    ? "s"
                                    : ""
                                }

                            </div>

                        </div>

                        <div class="league-count">

                            ${group.matches.length}

                        </div>

                    </div>

            `;


            group.matches.forEach(
                match => {

                    const home =
                        getTeam(match,"home");


                    const away =
                        getTeam(match,"away");


                    const homeName =
                        getTeamName(
                            match,
                            "home"
                        );


                    const awayName =
                        getTeamName(
                            match,
                            "away"
                        );


                    const status =
                        getStatus(match);


                    const score =
                        getScore(match);


                    html += `

                        <div class="match">

                            <div class="match-time">

                                🕐

                                ${escapeHtml(
                                    timeInMadagascar(
                                        match.event_date
                                    )
                                )}

                            </div>


                            <div class="match-grid">

                                <div class="team">

                                    ${teamLogoHtml(
                                        home,
                                        homeName
                                    )}

                                    <div class="team-name">

                                        ${escapeHtml(
                                            homeName
                                        )}

                                    </div>

                                </div>


                                <div class="match-center">

                                    <div class="${
                                        score
                                        ? "score"
                                        : "vs"
                                    }">

                                        ${
                                            score
                                            || "VS"
                                        }

                                    </div>

                                    <div
                                        class="status ${
                                            status.className
                                        }"
                                    >

                                        ${
                                            status.text
                                        }

                                    </div>

                                </div>


                                <div class="team">

                                    ${teamLogoHtml(
                                        away,
                                        awayName
                                    )}

                                    <div class="team-name">

                                        ${escapeHtml(
                                            awayName
                                        )}

                                    </div>

                                </div>

                            </div>

                        </div>

                    `;

                }
            );


            html += `

                </section>

            `;

        });


    content.innerHTML = html;

}


/* =====================================================
   LOAD JSON
===================================================== */

async function loadJson(url) {

    const response =
        await fetch(
            url + "?v=" + Date.now()
        );


    if (!response.ok) {

        throw new Error(
            `${url}: HTTP ${response.status}`
        );

    }


    return response.json();

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadAll() {

    const content =
        document.getElementById(
            "content"
        );


    try {

        content.innerHTML = `

            <div class="loading">

                ⚽ Chargement des données...

            </div>

        `;


        const [
            matchesData,
            teamsData,
            leaguesData
        ] = await Promise.all([

            loadJson("matches.json"),

            loadJson("teams.json"),

            loadJson("leagues.json")

        ]);


        /*
           MATCHES
        */

        matches =
            Array.isArray(
                matchesData.matches
            )

            ? matchesData.matches

            : [];


        /*
           TEAMS
        */

        teams =
            teamsData;


        /*
           LEAGUES
        */

        leagues =
            leaguesData;


        console.log(
            "MATCHES:",
            matches.length
        );


        console.log(
            "TEAMS DATA loaded"
        );


        console.log(
            "LEAGUES DATA loaded"
        );


        selectedDate =
            new Date();


        render();

    }

    catch(error) {

        console.error(error);


        content.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ❌
                </div>

                Impossible de charger les données.

                <br><br>

                <small>
                    ${escapeHtml(
                        error.message
                    )}
                </small>

            </div>

        `;

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

setInterval(
    loadAll,
    5 * 60 * 1000
);


/* =====================================================
   START
===================================================== */

loadAll();

</script>

</body>
</html>
