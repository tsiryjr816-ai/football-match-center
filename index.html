<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Match Center</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f1f4f8;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#06182d,#0b4f87);

.header{

.brand{

    align-items:center;
    gap:10px;
}

.ball{

    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.brand h1{

}

.brand p{

}

.tabs{

    gap:7px;

    margin-top:14px;

}

.tabs::-webkit-scrollbar{display:none}

.tab{

    color:#fff;

    font-size:12px;

}

.tab.active{

main{

.summary-row{

.counts{

}

.count{
    padding:5px 8px;

}

.count.live{

.count.upcoming{

.count.finished{

.refresh{

    background:#0b4f87;

}

.day{

.league{

    border-radius:14px;
    margin-bottom:11px;

    box-shadow:0 2px 9px rgba(0,0,0,.06);

.league-head{

.league-title{

}

.league-icon{

    align-items:center;

}

.league-name{
    font-size:13px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.country{
    color:#8a96a5;
    font-size:10px;

}

.league-games{
    color:#8a96a5;
    font-size:10px;
}

.match{
    padding:12px 10px;
    border-bottom:1px solid #edf1f5;
}

.match:last-child{

}

.match-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.time{
    font-size:12px;
    font-weight:800;
    color:#475569;
}

.badge{
    font-size:10px;
    font-weight:800;
}

.badge.live{

.badge.finished{
    color:#64748b;

.badge.upcoming{

}

.minute{

.teams{

}

.team{

}

.home{

    text-align:right;
}

.away{

    text-align:left;
}

.team-name{
    font-size:12px;
    font-weight:700;
    line-height:1.2;
    word-break:break-word;
}

.logo{
    width:38px;
    height:38px;
    object-fit:contain;
    flex:none;
}

.logo-fallback{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#edf1f5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    flex:none;
}

.center{
    text-align:center;
}

.score{
    font-size:19px;
    font-weight:900;
    white-space:nowrap;
}

.vs{
    color:#94a3b8;
    font-size:12px;
    font-weight:900;
}

.match-meta{
    text-align:center;
    margin-top:8px;
    color:#94a3b8;
    font-size:9px;
}

.live-card{

}

.live-dot{

}

.empty{

}

.loading{
    text-align:center;

   PREDICTION UI
========================= */

.prediction-box{

<header>
<div class="header">

```
<div class="brand">
    <div class="ball">⚽</div>
    <div>
        <h1>Football Match Center</h1>
        <p>Live • Résultats • Matchs à venir</p>
    </div>
</div>

<div class="tabs">
    <button class="tab active" data-filter="all">Tous</button>
    <button class="tab" data-filter="live">🔴 Live</button>
    <button class="tab" data-filter="upcoming">🕐 À venir</button>
    <button class="tab" data-filter="finished">✓ Terminés</button>

```

</div>
</header>

<main>

<div id="summary" class="summary">
    <div class="loading">Chargement des matchs...</div>
</div>

<div id="matches">
    <div class="loading">⏳ Chargement...</div>
</div>

</main>

<script>

const MATCHES_URL="./matches.json";
const TEAMS_URL="./teams.json";
const LEAGUES_URL="./leagues.json";

let matches=[];
let teams={};
let leagues={};
let currentFilter="all";

const TZ="Indian/Antananarivo";


async function loadJSON(url){

    const r=await fetch(url+"?v="+Date.now(),{
        cache:"no-store"
    });

    if(!r.ok){
        throw new Error(url+" HTTP "+r.status);
    }

    return await r.json();
}


/* =========================
   LOAD DATA
========================= */

async function init(){

    try{

        const matchData=await loadJSON(MATCHES_URL);

        matches=Array.isArray(matchData)
            ? matchData
            : (matchData.matches||[]);


        /* Teams */

        try{

            const teamData=await loadJSON(TEAMS_URL);

            const list=Array.isArray(teamData)
                ? teamData
                : (teamData.results||[]);

            list.forEach(t=>{
                teams[String(t.id)]=t;
            });

        }catch(e){
            console.warn("Teams:",e);
        }


        /* Leagues */

        try{

            const leagueData=await loadJSON(LEAGUES_URL);

            const list=Array.isArray(leagueData)
                ? leagueData
                : (leagueData.results||[]);

            list.forEach(l=>{
                leagues[String(l.id)]=l;
            });

        }catch(e){
            console.warn("Leagues:",e);
        }


        matches.sort((a,b)=>{

            return new Date(a.event_date||0)
                -new Date(b.event_date||0);

        });


        render();

    }catch(error){

        console.error(error);

        document.getElementById("summary").innerHTML=
            `<div class="error">
                ❌ Impossible de charger les matchs.<br>
                <small>${escapeHTML(error.message)}</small>
            </div>`;

        document.getElementById("matches").innerHTML="";

    }

}


/* =========================
   STATUS ENGINE
========================= */

function getStatus(m){

    const raw=String(m.status||"").toLowerCase().trim();

    const start=new Date(m.event_date);

    const now=Date.now();

    const scoreExists=
        m.home_score!==null &&
        m.home_score!==undefined &&
        m.away_score!==null &&
        m.away_score!==undefined;

    const minute=
        m.current_minute!==null &&
        m.current_minute!==undefined &&
        m.current_minute!=="";


    /* Explicit live */

    if(
        raw.includes("live")||
        raw.includes("progress")||
        raw.includes("playing")||
        raw.includes("inplay")||
        raw.includes("1st")||
        raw.includes("2nd")||
        raw==="ht"
    ){
        return "live";
    }


    /* Explicit finished */

    if(
        raw.includes("finished")||
        raw.includes("complete")||
        raw.includes("ended")||
        raw.includes("final")||
        raw==="ft"
    ){
        return "finished";
    }


    /* Current minute = live */

    if(minute){
        return "live";
    }


    /*
     * IMPORTANT:
     * notstarted + future = upcoming
     * notstarted + past = finished
     */

    if(!isNaN(start.getTime())){

        if(start.getTime()>now){

            return "upcoming";

        }

        /*
         * If started in the past and score exists,
         * keep as finished rather than upcoming.
         */

        if(scoreExists){
            return "finished";
        }

        /*
         * Unknown old match:
         * don't put it in upcoming.
         */

        return "finished";

    }


    return "upcoming";
}


/* =========================
   DATE / TIME
========================= */

function dateKey(date){

    return new Intl.DateTimeFormat("en-CA",{
        timeZone:TZ,
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
    }).format(date);

}


function formatDay(date){

    return new Intl.DateTimeFormat("fr-FR",{
        timeZone:TZ,
        weekday:"long",
        day:"2-digit",
        month:"long",
        year:"numeric"
    }).format(date);

}


function formatTime(date){

    return new Intl.DateTimeFormat("fr-FR",{
        timeZone:TZ,
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
    }).format(date);

}


/* =========================
   LOGOS
========================= */

function getLogo(team){

    if(!team)return null;

    return (
        team.logo_url||
        team.logo||
        team.crest_url||
        team.crest||
        team.badge_url||
        team.badge||
        team.image_url||
        team.image||
        null
    );

}


function logoHTML(team,name){

    const logo=getLogo(team);

    if(logo){

        return `
        <img
            class="logo"
            src="${escapeAttr(logo)}"
            alt=""
            loading="lazy"
            onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>⚽</div>'"
        >`;

    }

    return `<div class="logo-fallback">⚽</div>`;

}


/* =========================
   MATCH FILTER
========================= */

function filteredMatches(){

    return matches.filter(m=>{

        const s=getStatus(m);

        if(currentFilter==="all")return true;

        return s===currentFilter;

    });

}


/* =========================
   RENDER
========================= */

function render(){

    const list=filteredMatches();

    updateSummary();

    if(!list.length){

        document.getElementById("matches").innerHTML=
            `<div class="empty">
                Aucun match dans cette catégorie.
            </div>`;

        return;

    }


    const days={};


    list.forEach(m=>{

        const d=new Date(m.event_date);

        if(isNaN(d.getTime()))return;

        const key=dateKey(d);

        if(!days[key])days[key]=[];

        days[key].push(m);

    });


    let html="";


    Object.keys(days).sort().forEach(day=>{

        html+=`
        <div class="day">
            ${formatDay(new Date(days[day][0].event_date))}
        </div>`;


        const groups={};


        days[day].forEach(m=>{

            const id=String(m.league_id??"unknown");

            if(!groups[id])groups[id]=[];

            groups[id].push(m);

        });


        Object.keys(groups).forEach(id=>{

            const group=groups[id];

            const league=leagues[id];

            const name=
                league?.name||
                group[0].league_name||
                group[0].competition||
                "Football";


            const country=league?.country||"";


            html+=`
            <section class="league">

                <div class="league-head">

                    <div class="league-title">

                        <div class="league-icon">🏆</div>

                        <div>
                            <div class="league-name">
                                ${escapeHTML(name)}
                            </div>

                            ${
                                country
                                ? `<div class="country">
                                    ${escapeHTML(country)}
                                  </div>`
                                :""
                            }

                        </div>

                    </div>

                    <div class="league-games">
                        ${group.length} match${group.length>1?"s":""}
                    </div>

                </div>
            `;


            group.forEach(m=>{
                html+=matchHTML(m);
            });


            html+=`</section>`;

        });

    });


    document.getElementById("matches").innerHTML=html;

}



/* =========================
   PREDICTION ENGINE
   Safe / Medium / No Bet
========================= */

function predictionFinishedMatches(){
    return matches.filter(m=>{
        const hs=Number(m.home_score);
        const as=Number(m.away_score);

        return getStatus(m)==="finished" &&
               Number.isFinite(hs) &&
               Number.isFinite(as);
    });
}

function predictionTeamHistory(teamId, limit=10){
    const id=String(teamId);

    return predictionFinishedMatches()
        .filter(m=>
            String(m.home_team_id)===id ||
            String(m.away_team_id)===id
        )
        .sort((a,b)=>
            new Date(b.event_date)-new Date(a.event_date)
        )
        .slice(0,limit);
}

function predictionTeamStats(teamId){
    const games=predictionTeamHistory(teamId,10);

    let scored=0;
    let conceded=0;
    let wins=0;
    let draws=0;
    let losses=0;

    games.forEach(m=>{
        const hs=Number(m.home_score);
        const as=Number(m.away_score);

        const isHome=String(m.home_team_id)===String(teamId);

        const gf=isHome?hs:as;
        const ga=isHome?as:hs;

        scored+=gf;
        conceded+=ga;

        if(gf>ga) wins++;
        else if(gf===ga) draws++;
        else losses++;
    });

    return {
        games:games.length,
        scored,
        conceded,
        avgScored:games.length ? scored/games.length : 0,
        avgConceded:games.length ? conceded/games.length : 0,
        wins,
        draws,
        losses
    };
}

function predictionPoisson(k,lambda){
    if(lambda<=0) return 0;

    let factorial=1;

    for(let i=2;i<=k;i++){
        factorial*=i;
    }

    return Math.exp(-lambda)*
           Math.pow(lambda,k)/
           factorial;
}

function predictionEngine(match){

    const H=predictionTeamStats(match.home_team_id);
    const A=predictionTeamStats(match.away_team_id);

    /*
     * Tsy maminavina raha tsy ampy
     * ny historique.
     */
    if(H.games<3 || A.games<3){

        return {
            level:"NO BET",
            confidence:0,
            pick:"Données insuffisantes",
            home:33,
            draw:34,
            away:33,
            over15:0,
            over25:0,
            btts:0,
            score:"-",
            reason:"Historique insuffisant pour une analyse fiable."
        };
    }

    /*
     * Modèle simple basé amin'ny:
     * attaque + défense + avantage domicile.
     */
    let homeLambda=
        (H.avgScored*0.60)+
        (A.avgConceded*0.40);

    let awayLambda=
        (A.avgScored*0.60)+
        (H.avgConceded*0.40);

    homeLambda*=1.08;

    homeLambda=Math.max(0.15,Math.min(homeLambda,4));
    awayLambda=Math.max(0.15,Math.min(awayLambda,4));

    let homeWin=0;
    let draw=0;
    let awayWin=0;
    let over15=0;
    let over25=0;
    let btts=0;

    let bestScore="0-0";
    let bestScoreProb=0;

    for(let h=0;h<=6;h++){

        for(let a=0;a<=6;a++){

            const p=
                predictionPoisson(h,homeLambda)*
                predictionPoisson(a,awayLambda);

            if(h>a) homeWin+=p;
            else if(h===a) draw+=p;
            else awayWin+=p;

            if(h+a>=2) over15+=p;
            if(h+a>=3) over25+=p;
            if(h>=1 && a>=1) btts+=p;

            if(p>bestScoreProb){
                bestScoreProb=p;
                bestScore=`${h}-${a}`;
            }
        }
    }

    const candidates=[
        {name:"1X",probability:homeWin+draw},
        {name:"X2",probability:draw+awayWin},
        {name:"Over 1.5",probability:over15},
        {name:"Over 2.5",probability:over25},
        {name:"BTTS",probability:btts},
        {name:"Home",probability:homeWin},
        {name:"Draw",probability:draw},
        {name:"Away",probability:awayWin}
    ].sort((a,b)=>b.probability-a.probability);

    const best=candidates[0];
    const second=candidates[1];

    let confidence=Math.round(best.probability*100);

    let level="NO BET";

    if(confidence>=75) level="SAFE";
    else if(confidence>=62) level="MEDIUM";
    else if(confidence>=52) level="RISK";

    /*
     * Raha tsy misy elanelana mazava
     * amin'ny safidy roa voalohany,
     * dia tsy antsoina hoe SAFE.
     */
    if(
        second &&
        Math.abs(best.probability-second.probability)<0.025 &&
        level==="SAFE"
    ){
        level="MEDIUM";
    }

    return {
        level,
        confidence,
        pick:best.name,

        home:Math.round(homeWin*10
