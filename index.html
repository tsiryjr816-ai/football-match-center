<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Match Center & Prediction V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .badge-safe { background-color: #10B981; color: white; }
        .badge-medium { background-color: #F59E0B; color: white; }
        .badge-risk { background-color: #EF4444; color: white; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-gray-800">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-futbol text-2xl text-yellow-400"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Football Match Center</h1>
                    <p class="text-xs text-slate-400">Predictions Engine V3 Active</p>
                </div>
            </div>
            <span class="text-xs bg-emerald-600 px-3 py-1 rounded-full font-bold">V3 Smart Engine</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4">
        <!-- Filter Tabs -->
        <div class="flex space-x-2 mb-6 border-b pb-3 overflow-x-auto">
            <button onclick="filterMatchs('Tous')" id="btn-Tous" class="px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white shadow">Tous</button>
            <button onclick="filterMatchs('Live')" id="btn-Live" class="px-4 py-2 rounded-lg text-sm font-semibold bg-white text-gray-700 hover:bg-gray-200"><i class="fa-solid fa-circle text-red-500 text-xs mr-1"></i> Live</button>
            <button onclick="filterMatchs('À venir')" id="btn-À venir" class="px-4 py-2 rounded-lg text-sm font-semibold bg-white text-gray-700 hover:bg-gray-200">À venir</button>
            <button onclick="filterMatchs('Terminés')" id="btn-Terminés" class="px-4 py-2 rounded-lg text-sm font-semibold bg-white text-gray-700 hover:bg-gray-200">Terminés</button>
        </div>

        <!-- Alert Error Box (Fallback) -->
        <div id="alert-box" class="hidden mb-4 p-4 rounded-xl bg-red-100 border border-red-300 text-red-700 text-sm">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i>
            <span id="alert-msg">Erreur de chargement.</span>
        </div>

        <!-- Matches Container -->
        <div id="matches-container" class="space-y-4">
            <div class="text-center py-10 text-gray-500 font-medium">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-blue-600"></i><br>
                Chargement des matchs et calcul des prédictions V3...
            </div>
        </div>
    </main>

    <script>
        let allMatches = [];

        // Prediction Engine V3 (No "Données insuffisantes" fallback)
        function calculatePrediction(homeTeam, awayTeam, matchesHistory) {
            // Filter played matches for both teams
            const homeMatches = matchesHistory.filter(m => m.status === 'Terminés' && (m.home === homeTeam || m.away === homeTeam));
            const awayMatches = matchesHistory.filter(m => m.status === 'Terminés' && (m.home === awayTeam || m.away === awayTeam));

            const homeCount = homeMatches.length;
            const awayCount = awayMatches.length;
            const totalData = homeCount + awayCount;

            let homeScored = 0, homeConceded = 0;
            let awayScored = 0, awayConceded = 0;

            homeMatches.forEach(m => {
                if (m.home === homeTeam) {
                    homeScored += Number(m.homeScore || 0);
                    homeConceded += Number(m.awayScore || 0);
                } else {
                    homeScored += Number(m.awayScore || 0);
                    homeConceded += Number(m.homeScore || 0);
                }
            });

            awayMatches.forEach(m => {
                if (m.home === awayTeam) {
                    awayScored += Number(m.homeScore || 0);
                    awayConceded += Number(m.awayScore || 0);
                } else {
                    awayScored += Number(m.awayScore || 0);
                    awayConceded += Number(m.homeScore || 0);
                }
            });

            // Fallback averages if 0 or low data
            const avgHomeScored = homeCount > 0 ? (homeScored / homeCount) : 1.3;
            const avgHomeConceded = homeCount > 0 ? (homeConceded / homeCount) : 1.1;

            const avgAwayScored = awayCount > 0 ? (awayScored / awayCount) : 1.1;
            const avgAwayConceded = awayCount > 0 ? (awayConceded / awayCount) : 1.3;

            const expHomeGoals = (avgHomeScored + avgAwayConceded) / 2;
            const expAwayGoals = (avgAwayScored + avgHomeConceded) / 2;
            const totalExpGoals = expHomeGoals + expAwayGoals;

            // Prediction Logic V3
            let level = "MEDIUM";
            let tip = "Over 1.5 Goals";
            let btts = totalExpGoals > 2.2 ? "Oui" : "Non";
            let confidence = Math.min(88, Math.max(55, Math.round(totalExpGoals * 25 + totalData * 3)));

            if (totalData >= 4) {
                if (totalExpGoals >= 2.6) {
                    level = "SAFE";
                    tip = "Over 2.5 Goals / Victory Home";
                } else if (totalExpGoals < 1.6) {
                    level = "RISK";
                    tip = "Under 2.5 Goals";
                }
            } else {
                // If data is low, prevent over-confidence SAFE label
                level = "MEDIUM (Estimation Ligue)";
                tip = totalExpGoals >= 2.0 ? "Over 1.5 Goals" : "Double Chance (1X)";
                confidence = Math.min(68, confidence); 
            }

            const probableHome = Math.round(expHomeGoals);
            const probableAway = Math.round(expAwayGoals);

            return {
                level: level,
                tip: tip,
                score: `${probableHome} - ${probableAway}`,
                btts: btts,
                confidence: `${confidence}%`,
                dataQuality: totalData >= 4 ? `Bonne (${totalData} matchs analysés)` : `Faible (${totalData} matchs - Mode Estimé)`
            };
        }

        // Fetch Data from matches.json
        async function fetchMatches() {
            try {
                const res = await fetch('./matches.json');
                if (!res.ok) throw new Error(`Status ${res.status}`);
                allMatches = await res.json();
                renderMatches(allMatches);
            } catch (err) {
                console.error(err);
                const alertBox = document.getElementById('alert-box');
                document.getElementById('alert-msg').innerText = `Erreur: Impossible de charger 'matches.json'. (${err.message})`;
                alertBox.classList.remove('hidden');
                document.getElementById('matches-container').innerHTML = '';
            }
        }

        // Render UI
        function renderMatches(matches) {
            const container = document.getElementById('matches-container');
            if (!matches || matches.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-500">Aucun match trouvé.</div>`;
                return;
            }

            container.innerHTML = matches.map(m => {
                const pred = calculatePrediction(m.home, m.away, allMatches);
                
                let badgeClass = "badge-medium";
                if (pred.level.includes("SAFE")) badgeClass = "badge-safe";
                if (pred.level.includes("RISK")) badgeClass = "badge-risk";

                const isPlayed = m.status === 'Terminés' || m.status === 'Live';

                return `
                    <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-2 font-medium">
                            <span>${m.league || 'Championnat'}</span>
                            <span class="${m.status === 'Live' ? 'text-red-600 font-bold animate-pulse' : ''}">${m.status} ${m.time ? '• ' + m.time : ''}</span>
                        </div>
                        
                        <div class="flex justify-between items-center my-3">
                            <div class="font-bold text-base w-2/5 text-right text-slate-800">${m.home}</div>
                            <div class="bg-slate-100 px-3 py-1.5 rounded-xl text-sm font-black text-slate-700 mx-2 min-w-[60px] text-center">
                                ${isPlayed ? `${m.homeScore} - ${m.awayScore}` : 'VS'}
                            </div>
                            <div class="font-bold text-base w-2/5 text-left text-slate-800">${m.away}</div>
                        </div>

                        <!-- Prediction Panel V3 -->
                        <div class="mt-3 pt-3 border-t border-slate-100 bg-slate-50 p-3 rounded-xl">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-slate-700 flex items-center">
                                    <i class="fa-solid fa-brain text-indigo-500 mr-1.5"></i> Prédiction:
                                </span>
                                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black tracking-wide ${badgeClass}">
                                    ${pred.level}
                                </span>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-xs text-slate-600">
                                <div><span class="text-slate-400">Conseil:</span> <strong>${pred.tip}</strong></div>
                                <div><span class="text-slate-400">Score Probable:</span> <strong>${pred.score}</strong></div>
                                <div><span class="text-slate-400">BTTS:</span> <strong>${pred.btts}</strong></div>
                                <div><span class="text-slate-400">Confiance:</span> <strong class="text-indigo-600">${pred.confidence}</strong></div>
                            </div>
                            <div class="mt-2 text-[10px] text-slate-400 text-right">
                                ${pred.dataQuality}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter Logic
        function filterMatchs(status) {
            document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
                btn.className = "px-4 py-2 rounded-lg text-sm font-semibold bg-white text-gray-700 hover:bg-gray-200";
            });
            document.getElementById(`btn-${status}`).className = "px-4 py-2 rounded-lg text-sm font-semibold bg-blue-600 text-white shadow";

            if (status === 'Tous') {
                renderMatches(allMatches);
            } else {
                renderMatches(allMatches.filter(m => m.status === status));
            }
        }

        fetchMatches();
    </script>
</body>
</html>
