<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Match Center</title>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b4f87">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f1f4f8;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#06182d,#0b4f87);
    color:#fff;
    padding:16px 12px 12px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.header{
    max-width:850px;
    margin:auto;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.ball{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.brand h1{
    font-size:19px;
}

.brand p{
    font-size:11px;
    opacity:.72;
    margin-top:3px;
}

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-top:14px;
    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{display:none}

.tab{
    border:0;
    border-radius:22px;
    padding:9px 14px;
    background:rgba(255,255,255,.12);
    color:#fff;
    white-space:nowrap;
    font-size:12px;
    font-weight:600;
}

.tab.active{
    background:#fff;
    color:#0b4f87;
}

main{
    max-width:850px;
    margin:auto;
    padding:10px 8px 50px;
}

.summary{
    background:#fff;
    border-radius:13px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 9px rgba(0,0,0,.06);
    font-size:12px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.counts{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:8px;
}

.count{
    padding:5px 8px;
    border-radius:7px;
    background:#f1f5f9;
    font-size:11px;
}

.count.live{
    color:#dc163d;
    background:#fff0f2;
}

.count.upcoming{
    color:#087f5b;
    background:#eafbf4;
}

.count.finished{
    color:#64748b;
}

.refresh{
    border:0;
    background:#0b4f87;
    color:#fff;
    padding:7px 10px;
    border-radius:8px;
    font-size:11px;
}

.day{
    margin:16px 2px 8px;
    font-size:13px;
    font-weight:800;
    color:#334155;
    text-transform:capitalize;
}

.league{
    background:#fff;
    border-radius:14px;
    margin-bottom:11px;
    overflow:hidden;
    box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.league-head{
    padding:10px 12px;
    background:#f8fafc;
    border-bottom:1px solid #e8edf2;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.league-title{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
}

.league-icon{
    width:31px;
    height:31px;
    border-radius:8px;
    background:#e9eff6;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
}

.league-name{
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.country{
    color:#8a96a5;
    font-size:10px;
    margin-top:2px;
}

.league-games{
    color:#8a96a5;
    font-size:10px;
}

.match{
    padding:12px 10px;
    border-bottom:1px solid #edf1f5;
}

.match:last-child{
    border-bottom:0;
}

.match-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.time{
    font-size:12px;
    font-weight:800;
    color:#475569;
}

.badge{
    font-size:10px;
    font-weight:800;
}

.badge.live{
    color:#e11d48;
}

.badge.finished{
    color:#64748b;
}

.badge.upcoming{
    color:#087f5b;
}

.minute{
    margin-left:4px;
    color:#e11d48;
}

.teams{
    display:grid;
    grid-template-columns:minmax(0,1fr) 55px minmax(0,1fr);
    align-items:center;
    gap:7px;
}

.team{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
}

.home{
    justify-content:flex-end;
    text-align:right;
}

.away{
    justify-content:flex-start;
    text-align:left;
}

.team-name{
    font-size:12px;
    font-weight:700;
    line-height:1.2;
    word-break:break-word;
}

.logo{
    width:38px;
    height:38px;
    object-fit:contain;
    flex:none;
}

.logo-fallback{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#edf1f5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    flex:none;
}

.center{
    text-align:center;
}

.score{
    font-size:19px;
    font-weight:900;
    white-space:nowrap;
}

.vs{
    color:#94a3b8;
    font-size:12px;
    font-weight:900;
}

.match-meta{
    text-align:center;
    margin-top:8px;
    color:#94a3b8;
    font-size:9px;
}

.live-card{
    background:linear-gradient(180deg,#fff,#fff8f9);
}

.live-dot{
    display:inline-block;
    width:6px;
    height:6px;
    background:#e11d48;
    border-radius:50%;
    margin-right:4px;
}

.empty{
    background:#fff;
    border-radius:13px;
    padding:35px 15px;
    text-align:center;
    color:#64748b;
    font-size:13px;
}

.loading{
    text-align:center;
    padding:40px 10px;
    color:#64748b;
}

.error{
    background:#fff0f0;
    color:#a40000;
    padding:14px;
    border-radius:12px;
    font-size:12px;
}

@media(max-width:480px){

    header{
        padding:13px 9px 10px;
    }

    .brand h1{
        font-size:17px;
    }

    main{
        padding:8px 6px 40px;
    }

    .teams{
        grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);
    }

    .team-name{
        font-size:11px;
    }

    .logo,
    .logo-fallback{
        width:34px;
        height:34px;
    }

    .score{
        font-size:17px;
    }
}
</style>

</head>

<body>

<header>
<div class="header">

```
<div class="brand">
    <div class="ball">⚽</div>
    <div>
        <h1>Football Match Center</h1>
        <p>Live • Résultats • Matchs à venir</p>
    </div>
</div>

<div class="tabs">
    <button class="tab active" data-filter="all">Tous</button>
    <button class="tab" data-filter="live">🔴 Live</button>
    <button class="tab" data-filter="upcoming">🕐 À venir</button>
    <button class="tab" data-filter="finished">✓ Terminés</button>
</div>
```

</div>
</header>

<main>

<div id="summary" class="summary">
    <div class="loading">Chargement des matchs...</div>
</div>

<div id="matches">
    <div class="loading">⏳ Chargement...</div>
</div>

</main>

<script>

const MATCHES_URL="./matches.json";
const TEAMS_URL="./teams.json";
const LEAGUES_URL="./leagues.json";

let matches=[];
let teams={};
let leagues={};
let currentFilter="all";

const TZ="Indian/Antananarivo";


async function loadJSON(url){

    const r=await fetch(url+"?v="+Date.now(),{
        cache:"no-store"
    });

    if(!r.ok){
        throw new Error(url+" HTTP "+r.status);
    }

    return await r.json();
}


/* =========================
   LOAD DATA
========================= */

async function init(){

    try{

        const matchData=await loadJSON(MATCHES_URL);

        matches=Array.isArray(matchData)
            ? matchData
            : (matchData.matches||[]);


        /* Teams */

        try{

            const teamData=await loadJSON(TEAMS_URL);

            const list=Array.isArray(teamData)
                ? teamData
                : (teamData.results||[]);

            list.forEach(t=>{
                teams[String(t.id)]=t;
            });

        }catch(e){
            console.warn("Teams:",e);
        }


        /* Leagues */

        try{

            const leagueData=await loadJSON(LEAGUES_URL);

            const list=Array.isArray(leagueData)
                ? leagueData
                : (leagueData.results||[]);

            list.forEach(l=>{
                leagues[String(l.id)]=l;
            });

        }catch(e){
            console.warn("Leagues:",e);
        }


        matches.sort((a,b)=>{

            return new Date(a.event_date||0)
                -new Date(b.event_date||0);

        });


        render();

    }catch(error){

        console.error(error);

        document.getElementById("summary").innerHTML=
            `<div class="error">
                ❌ Impossible de charger les matchs.<br>
                <small>${escapeHTML(error.message)}</small>
            </div>`;

        document.getElementById("matches").innerHTML="";

    }

}


/* =========================
   STATUS ENGINE
========================= */

function getStatus(m){

    const raw=String(m.status||"").toLowerCase().trim();

    const start=new Date(m.event_date);

    const now=Date.now();

    const scoreExists=
        m.home_score!==null &&
        m.home_score!==undefined &&
        m.away_score!==null &&
        m.away_score!==undefined;

    const minute=
        m.current_minute!==null &&
        m.current_minute!==undefined &&
        m.current_minute!=="";


    /* Explicit live */

    if(
        raw.includes("live")||
        raw.includes("progress")||
        raw.includes("playing")||
        raw.includes("inplay")||
        raw.includes("1st")||
        raw.includes("2nd")||
        raw==="ht"
    ){
        return "live";
    }


    /* Explicit finished */

    if(
        raw.includes("finished")||
        raw.includes("complete")||
        raw.includes("ended")||
        raw.includes("final")||
        raw==="ft"
    ){
        return "finished";
    }


    /* Current minute = live */

    if(minute){
        return "live";
    }


    /*
     * IMPORTANT:
     * notstarted + future = upcoming
     * notstarted + past = finished
     */

    if(!isNaN(start.getTime())){

        if(start.getTime()>now){

            return "upcoming";

        }

        /*
         * If started in the past and score exists,
         * keep as finished rather than upcoming.
         */

        if(scoreExists){
            return "finished";
        }

        /*
         * Unknown old match:
         * don't put it in upcoming.
         */

        return "finished";

    }


    return "upcoming";
}


/* =========================
   DATE / TIME
========================= */

function dateKey(date){

    return new Intl.DateTimeFormat("en-CA",{
        timeZone:TZ,
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
    }).format(date);

}


function formatDay(date){

    return new Intl.DateTimeFormat("fr-FR",{
        timeZone:TZ,
        weekday:"long",
        day:"2-digit",
        month:"long",
        year:"numeric"
    }).format(date);

}


function formatTime(date){

    return new Intl.DateTimeFormat("fr-FR",{
        timeZone:TZ,
        hour:"2-digit",
        minute:"2-digit",
        hour12:false
    }).format(date);

}


/* =========================
   LOGOS
========================= */

function getLogo(team){

    if(!team)return null;

    return (
        team.logo_url||
        team.logo||
        team.crest_url||
        team.crest||
        team.badge_url||
        team.badge||
        team.image_url||
        team.image||
        null
    );

}


function logoHTML(team,name){

    const logo=getLogo(team);

    if(logo){

        return `
        <img
            class="logo"
            src="${escapeAttr(logo)}"
            alt=""
            loading="lazy"
            onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>⚽</div>'"
        >`;

    }

    return `<div class="logo-fallback">⚽</div>`;

}


/* =========================
   MATCH FILTER
========================= */

function filteredMatches(){

    return matches.filter(m=>{

        const s=getStatus(m);

        if(currentFilter==="all")return true;

        return s===currentFilter;

    });

}


/* =========================
   RENDER
========================= */

function render(){

    const list=filteredMatches();

    updateSummary();

    if(!list.length){

        document.getElementById("matches").innerHTML=
            `<div class="empty">
                Aucun match dans cette catégorie.
            </div>`;

        return;

    }


    const days={};


    list.forEach(m=>{

        const d=new Date(m.event_date);

        if(isNaN(d.getTime()))return;

        const key=dateKey(d);

        if(!days[key])days[key]=[];

        days[key].push(m);

    });


    let html="";


    Object.keys(days).sort().forEach(day=>{

        html+=`
        <div class="day">
            ${formatDay(new Date(days[day][0].event_date))}
        </div>`;


        const groups={};


        days[day].forEach(m=>{

            const id=String(m.league_id??"unknown");

            if(!groups[id])groups[id]=[];

            groups[id].push(m);

        });


        Object.keys(groups).forEach(id=>{

            const group=groups[id];

            const league=leagues[id];

            const name=
                league?.name||
                group[0].league_name||
                group[0].competition||
                "Football";


            const country=league?.country||"";


            html+=`
            <section class="league">

                <div class="league-head">

                    <div class="league-title">

                        <div class="league-icon">🏆</div>

                        <div>
                            <div class="league-name">
                                ${escapeHTML(name)}
                            </div>

                            ${
                                country
                                ? `<div class="country">
                                    ${escapeHTML(country)}
                                  </div>`
                                :""
                            }

                        </div>

                    </div>

                    <div class="league-games">
                        ${group.length} match${group.length>1?"s":""}
                    </div>

                </div>
            `;


            group.forEach(m=>{
                html+=matchHTML(m);
            });


            html+=`</section>`;

        });

    });


    document.getElementById("matches").innerHTML=html;

}


/* =========================
   MATCH CARD
========================= */

function matchHTML(m){

    const status=getStatus(m);

    const date=new Date(m.event_date);

    const home=
        teams[String(m.home_team_id)]||
        {
            id:m.home_team_id,
            name:m.home_team
        };


    const away=
        teams[String(m.away_team_id)]||
        {
            id:m.away_team_id,
            name:m.away_team
        };


    const homeName=
        home.name||
        m.home_team||
        "Home";


    const awayName=
        away.name||
        m.away_team||
        "Away";


    let center="";


    if(status==="upcoming"){

        center=`<div class="score vs">VS</div>`;

    }else{

        center=`
        <div class="score">
            ${safeScore(m.home_score)}
            -
            ${safeScore(m.away_score)}
        </div>`;

    }


    let badge="";


    if(status==="live"){

        const minute=m.current_minute;

        badge=`
            <span class="badge live">
                <span class="live-dot"></span>LIVE
                ${minute!==null&&minute!==undefined&&minute!==""
                    ?`<span class="minute">${escapeHTML(minute)}'</span>`
                    :""
                }
            </span>`;

    }else if(status==="finished"){

        badge=`<span class="badge finished">✓ Terminé</span>`;

    }else{

        badge=`<span class="badge upcoming">🕐 À venir</span>`;

    }


    return `
    <article class="match ${status==="live"?"live-card":""}">

        <div class="match-top">

            <div class="time">
                ${formatTime(date)}
            </div>

            <div>
                ${badge}
            </div>

        </div>


        <div class="teams">

            <div class="team home">

                <div class="team-name">
                    ${escapeHTML(homeName)}
                </div>

                ${logoHTML(home,homeName)}

            </div>


            <div class="center">
                ${center}
            </div>


            <div class="team away">

                ${logoHTML(away,awayName)}

                <div class="team-name">
                    ${escapeHTML(awayName)}
                </div>

            </div>

        </div>


        ${
            m.round_name
            ?`<div class="match-meta">
                ${escapeHTML(m.round_name)}
              </div>`
            :""
        }

    </article>`;
}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

    const live=matches.filter(m=>getStatus(m)==="live").length;
    const upcoming=matches.filter(m=>getStatus(m)==="upcoming").length;
    const finished=matches.filter(m=>getStatus(m)==="finished").length;


    document.getElementById("summary").innerHTML=`

        <div class="summary-row">

            <strong>
                ${matches.length} matchs
            </strong>

            <button class="refresh" onclick="init()">
                🔄 Actualiser
            </button>

        </div>

        <div class="counts">

            <span class="count live">
                🔴 ${live} Live
            </span>

            <span class="count upcoming">
                🕐 ${upcoming} À venir
            </span>

            <span class="count finished">
                ✓ ${finished} Terminés
            </span>

        </div>

    `;

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHTML(value);

}


function safeScore(value){

    return value===null||
           value===undefined||
           value===""
        ?"-"
        :escapeHTML(value);

}


/* =========================
   TABS
========================= */

document.querySelectorAll(".tab").forEach(btn=>{

    btn.addEventListener("click",()=>{

        document.querySelectorAll(".tab")
            .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        currentFilter=btn.dataset.filter;

        render();

    });

});


/* =========================
   START
========================= */

init();


/* Auto refresh 5 minutes */

setInterval(()=>{
    init();
},300000);
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register("./service-worker.js")
            .then(function() {
                console.log("PWA Ready");
            })
            .catch(function(error) {
                console.error("PWA Error:", error);
            });
    });
}
</script>
    
</script>

</body>
</html>
