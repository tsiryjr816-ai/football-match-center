<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Match Center</title>

<style>
/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#f4f6f9;
    color:#17243b;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
}

/* =========================================================
   VARIABLES
========================================================= */

:root{
    --primary:#123d72;
    --primary-dark:#0d2f5b;
    --text:#17243b;
    --muted:#718096;
    --light:#f7f9fc;
    --border:#e3e8ef;
    --white:#ffffff;
    --live:#e53935;
    --live-bg:#fff1f1;
    --finished:#159765;
    --finished-bg:#edf9f3;
    --upcoming:#66758a;
    --upcoming-bg:#f1f4f8;
    --shadow:0 4px 18px rgba(19,45,76,.07);
}

/* =========================================================
   HEADER
========================================================= */

.header{
    background:#ffffff;
    padding:20px 16px 18px;
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 12px rgba(15,35,65,.05);
}

.header-inner{
    max-width:760px;
    margin:auto;
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;

    color:var(--primary);

    font-size:24px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo-icon{
    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    background:#edf3fa;

    font-size:24px;
}

.subtitle{
    margin-top:5px;
    margin-left:54px;

    color:var(--muted);

    font-size:13px;
}

/* =========================================================
   DATE BAR
========================================================= */

.date-bar{
    position:sticky;
    top:0;
    z-index:30;

    display:flex;
    align-items:center;
    justify-content:space-between;

    max-width:760px;
    margin:0 auto;

    padding:10px 12px;

    background:rgba(255,255,255,.96);

    border-bottom:1px solid var(--border);

    box-shadow:0 2px 10px rgba(15,35,65,.05);

    backdrop-filter:blur(10px);
}

.date-button{
    width:44px;
    height:44px;

    border:1px solid #dbe2ea;
    border-radius:12px;

    background:#ffffff;
    color:var(--primary);

    font-size:22px;
    font-weight:700;

    cursor:pointer;

    box-shadow:0 2px 6px rgba(15,35,65,.04);

    transition:.15s ease;
}

.date-button:hover{
    background:#f5f8fc;
}

.date-button:active{
    transform:scale(.94);
}

.date-center{
    flex:1;
    text-align:center;
}

.date-title{
    color:var(--primary);

    font-size:18px;
    font-weight:800;

    text-transform:capitalize;
}

.date-full{
    margin-top:3px;

    color:var(--muted);

    font-size:12px;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    display:flex;
    gap:10px;

    max-width:760px;
    margin:0 auto;

    padding:12px;

    overflow-x:auto;
}

.stat{
    flex:1;
    min-width:100px;

    padding:13px 10px;

    background:#ffffff;

    border:1px solid var(--border);
    border-radius:13px;

    text-align:center;

    box-shadow:var(--shadow);
}

.stat-number{
    color:var(--primary);

    font-size:21px;
    font-weight:800;
}

.stat-label{
    margin-top:4px;

    color:#8995a6;

    font-size:10px;
    font-weight:700;

    letter-spacing:.5px;
}

/* =========================================================
   MAIN
========================================================= */

.container{
    max-width:760px;
    margin:0 auto;

    padding:0 12px 35px;
}

/* =========================================================
   LEAGUE
========================================================= */

.league{
    margin-top:15px;

    overflow:hidden;

    background:#ffffff;

    border:1px solid var(--border);
    border-radius:15px;

    box-shadow:var(--shadow);
}

.league-title{
    display:flex;
    align-items:center;
    gap:8px;

    padding:13px 15px;

    background:#ffffff;

    color:var(--primary);

    font-size:14px;
    font-weight:800;

    border-bottom:1px solid var(--border);
}

.league-icon{
    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:#eef4fb;

    font-size:14px;
}

/* =========================================================
   MATCH
========================================================= */

.match{
    display:grid;

    grid-template-columns:62px 1fr 70px;

    align-items:center;

    gap:8px;

    min-height:108px;

    padding:14px 12px;

    background:#ffffff;

    border-top:1px solid #edf0f4;

    transition:.15s ease;
}

.match:first-of-type{
    border-top:0;
}

.match:hover{
    background:#fbfcfe;
}

/* =========================================================
   TIME
========================================================= */

.time{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:#506078;

    font-size:12px;
    font-weight:700;

    text-align:center;
}

.time-icon{
    margin-bottom:4px;

    color:#a0aaba;

    font-size:11px;
}

/* =========================================================
   TEAMS
========================================================= */

.teams{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    min-width:0;

    text-align:center;
}

.team{
    max-width:100%;

    margin:3px 0;

    overflow:hidden;

    color:#17243b;

    font-size:15px;
    font-weight:700;

    line-height:1.25;

    text-overflow:ellipsis;
    white-space:nowrap;
}

.vs{
    margin:1px 0;

    color:#a0aaba;

    font-size:9px;
    font-weight:700;

    letter-spacing:.5px;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    margin-top:5px;

    padding:4px 9px;

    border-radius:20px;

    background:var(--upcoming-bg);
    color:var(--upcoming);

    border:1px solid #e2e7ee;

    font-size:9px;
    font-weight:800;

    letter-spacing:.3px;
}

.status.live{
    background:var(--live-bg);
    color:var(--live);

    border-color:#ffd5d5;
}

.status.live::before{
    content:"";

    width:6px;
    height:6px;

    margin-right:5px;

    border-radius:50%;

    background:var(--live);

    animation:pulse 1.3s infinite;
}

.status.finished{
    background:var(--finished-bg);
    color:var(--finished);

    border-color:#cceedd;
}

.status.finished::before{
    content:"✓";

    margin-right:4px;
}

@keyframes pulse{

    0%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.45;
        transform:scale(.75);
    }

    100%{
        opacity:1;
        transform:scale(1);
    }

}

/* =========================================================
   SCORE
========================================================= */

.score{
    display:flex;
    align-items:center;
    justify-content:center;

    min-height:60px;

    color:var(--primary);

    font-size:18px;
    font-weight:900;

    text-align:center;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.empty,
.loading{
    margin-top:15px;

    padding:55px 20px;

    background:#ffffff;

    border:1px solid var(--border);
    border-radius:15px;

    color:#7d8999;

    text-align:center;

    box-shadow:var(--shadow);
}

.empty-icon,
.loading-icon{
    display:block;

    margin-bottom:12px;

    font-size:34px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    max-width:760px;
    margin:0 auto;

    padding:5px 20px 28px;

    color:#8b96a5;

    font-size:11px;

    text-align:center;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .header{
        padding:17px 14px 16px;
    }

    .logo{
        font-size:21px;
    }

    .logo-icon{
        width:40px;
        height:40px;

        font-size:22px;
    }

    .subtitle{
        margin-left:51px;
        font-size:12px;
    }

    .date-bar{
        padding:9px 10px;
    }

    .date-button{
        width:42px;
        height:42px;

        font-size:20px;
    }

    .date-title{
        font-size:16px;
    }

    .date-full{
        font-size:11px;
    }

    .stats{
        gap:7px;
        padding:10px 9px;
    }

    .stat{
        min-width:88px;
        padding:11px 8px;
    }

    .stat-number{
        font-size:19px;
    }

    .stat-label{
        font-size:9px;
    }

    .container{
        padding:0 9px 30px;
    }

    .league{
        border-radius:13px;
    }

    .league-title{
        padding:12px 13px;
        font-size:13px;
    }

    .match{
        grid-template-columns:55px 1fr 62px;

        min-height:103px;

        padding:13px 8px;

        gap:5px;
    }

    .time{
        font-size:11px;
    }

    .team{
        font-size:14px;
    }

    .score{
        font-size:17px;
    }

    .status{
        padding:3px 7px;
        font-size:8px;
    }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px){

    .match{
        grid-template-columns:51px 1fr 57px;

        padding-left:6px;
        padding-right:6px;
    }

    .team{
        font-size:13px;
    }

    .time{
        font-size:10px;
    }

    .score{
        font-size:16px;
    }

    .status{
        padding:3px 6px;
        font-size:7px;
    }

}
</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">

        <div class="logo">

            <div class="logo-icon">
                ⚽
            </div>

            <div>
                Football Match Center
            </div>

        </div>

        <div class="subtitle">
            Fixtures & résultats automatiques
        </div>

    </div>

</header>


<!-- =====================================================
     DATE NAVIGATION
===================================================== -->

<div class="date-bar">

    <button
        class="date-button"
        onclick="changeDay(-1)"
        aria-label="Jour précédent"
    >
        ←
    </button>


    <div class="date-center">

        <div
            id="dateTitle"
            class="date-title"
        >
            Chargement...
        </div>

        <div
            id="dateFull"
            class="date-full"
        >
        </div>

    </div>


    <button
        class="date-button"
        onclick="changeDay(1)"
        aria-label="Jour suivant"
    >
        →
    </button>

</div>


<!-- =====================================================
     STATISTICS
===================================================== -->

<div class="stats">

    <div class="stat">

        <div
            id="totalMatches"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            MATCHS
        </div>

    </div>


    <div class="stat">

        <div
            id="liveMatches"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            LIVE
        </div>

    </div>


    <div class="stat">

        <div
            id="finishedMatches"
            class="stat-number"
        >
            0
        </div>

        <div class="stat-label">
            TERMINÉS
        </div>

    </div>

</div>


<!-- =====================================================
     MATCHES
===================================================== -->

<main class="container">

    <div id="matches">

        <div class="loading">

            <span class="loading-icon">
                ⚽
            </span>

            Chargement des matchs...

        </div>

    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<div class="footer">

    Données mises à jour automatiquement

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let allMatches = [];

let currentDate = new Date();

const MADAGASCAR_TIMEZONE =
    "Indian/Antananarivo";


/* =====================================================
   MOIS
===================================================== */

const MONTHS = [

    "janvier",
    "février",
    "mars",
    "avril",
    "mai",
    "juin",
    "juillet",
    "août",
    "septembre",
    "octobre",
    "novembre",
    "décembre"

];


/* =====================================================
   DATE MADAGASCAR
===================================================== */

function getMadagascarDate(dateString){

    const date =
        new Date(dateString);

    return new Intl.DateTimeFormat(

        "en-CA",

        {
            timeZone: MADAGASCAR_TIMEZONE,

            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }

    ).format(date);

}


/* =====================================================
   HEURE MADAGASCAR
===================================================== */

function getMadagascarTime(dateString){

    const date =
        new Date(dateString);

    return new Intl.DateTimeFormat(

        "fr-FR",

        {
            timeZone: MADAGASCAR_TIMEZONE,

            hour: "2-digit",
            minute: "2-digit",

            hour12: false
        }

    ).format(date);

}


/* =====================================================
   DATE SELECTIONNEE
===================================================== */

function getSelectedDate(){

    return new Intl.DateTimeFormat(

        "en-CA",

        {
            timeZone: MADAGASCAR_TIMEZONE,

            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }

    ).format(currentDate);

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

    const day =
        date.getDate();

    const month =
        MONTHS[date.getMonth()];

    const year =
        date.getFullYear();

    return `${day} ${month} ${year}`;

}


/* =====================================================
   STATUS NORMALIZATION
===================================================== */

function normalizeStatus(status){

    return String(status || "")

        .toLowerCase()

        .replace(/[\s_-]/g, "");

}


/* =====================================================
   STATUS MATCH
===================================================== */

function getMatchStatus(match){

    const status =
        normalizeStatus(match.status);


    /* MATCH A VENIR */

    if(

        status === "notstarted" ||
        status === "scheduled" ||
        status === "upcoming" ||
        status === "created"

    ){

        return {

            text:"À VENIR",

            className:""

        };

    }


    /* MATCH LIVE */

    if(

        status === "live" ||
        status === "inprogress" ||
        status === "playing" ||
        status === "halftime"

    ){

        return {

            text:"LIVE",

            className:"live"

        };

    }


    /* MATCH TERMINE */

    if(

        status === "finished" ||
        status === "finish" ||
        status === "completed" ||
        status === "complete"

    ){

        return {

            text:"TERMINÉ",

            className:"finished"

        };

    }


    /* AUTRE */

    return {

        text:"À VENIR",

        className:""

    };

}


/* =====================================================
   SCORE
===================================================== */

function getMatchScore(match){

    const status =
        normalizeStatus(match.status);


    /*
       MATCH PAS ENCORE COMMENCE
    */

    if(

        status === "notstarted" ||
        status === "scheduled" ||
        status === "upcoming" ||
        status === "created"

    ){

        return "VS";

    }


    const homeScore =
        match.home_score ??
        match.home_goals ??
        match.home_team_score ??
        match.score_home ??
        null;


    const awayScore =
        match.away_score ??
        match.away_goals ??
        match.away_team_score ??
        match.score_away ??
        null;


    if(

        homeScore !== null &&
        homeScore !== undefined &&
        awayScore !== null &&
        awayScore !== undefined

    ){

        return `${homeScore} - ${awayScore}`;

    }


    return "VS";

}


/* =====================================================
   SECURITE HTML
===================================================== */

function escapeHtml(value){

    return String(value || "")

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =====================================================
   CHANGER DE JOUR
===================================================== */

function changeDay(number){

    currentDate.setDate(

        currentDate.getDate() + number

    );

    renderMatches();

}


/* =====================================================
   AFFICHAGE
===================================================== */

function renderMatches(){

    const selectedDate =
        getSelectedDate();


    /* DATE */

    document
        .getElementById("dateTitle")
        .textContent =

        currentDate.toLocaleDateString(

            "fr-FR",

            {
                weekday:"long"
            }

        );


    document
        .getElementById("dateFull")
        .textContent =

        formatDate(currentDate);


    /* FILTRAGE */

    const matches =

        allMatches.filter(

            function(match){

                if(!match.event_date){

                    return false;

                }


                return (

                    getMadagascarDate(
                        match.event_date
                    )

                    ===

                    selectedDate

                );

            }

        );


    /* TOTAL */

    document
        .getElementById("totalMatches")
        .textContent = matches.length;


    /* COMPTEURS */

    let liveCount = 0;

    let finishedCount = 0;


    matches.forEach(

        function(match){

            const status =

                normalizeStatus(
                    match.status
                );


            if(

                status === "live" ||
                status === "inprogress" ||
                status === "playing" ||
                status === "halftime"

            ){

                liveCount++;

            }


            if(

                status === "finished" ||
                status === "finish" ||
                status === "completed" ||
                status === "complete"

            ){

                finishedCount++;

            }

        }

    );


    document
        .getElementById("liveMatches")
        .textContent = liveCount;


    document
        .getElementById("finishedMatches")
        .textContent =
