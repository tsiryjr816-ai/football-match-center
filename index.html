<body>

<header>
<div class="header">

    <div class="brand">
        <div class="ball">⚽</div>
        <div>
            <div class="title">Football Match Center</div>
            <div class="subtitle">Live • Résultats • Matchs à venir</div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-filter="all">Tous</button>
        <button class="tab" data-filter="live">🔴 Live</button>
        <button class="tab" data-filter="upcoming">🕐 À venir</button>
        <button class="tab" data-filter="finished">✓ Terminés</button>
    </div>

</div>
</header>

<main class="container">

    <div id="statusBox" class="status-box">
        <div class="status-line">
            <span id="statusText">Chargement des données...</span>
            <button class="refresh" onclick="loadEverything()">↻</button>
        </div>

        <div id="stats" class="stats"></div>
    </div>

    <div id="matches">
        <div class="loading">
            <div class="spinner"></div>
            <div>Chargement des matchs...</div>
        </div>
    </div>

    <div class="footer">
        Football Match Center
    </div>

</main>

<script>

const MATCHES_URL = "./matches.json";
const TEAMS_URL = "./teams.json";
const LEAGUES_URL = "./leagues.json";

const TZ = "Indian/Antananarivo";

let matches = [];
let teams = {};
let leagues = {};
let currentFilter = "all";


/* =====================================================
   FETCH JSON
===================================================== */

async function fetchJSON(url){

    const response = await fetch(
        url + "?v=" + Date.now(),
        {
            cache:"no-store"
        }
    );

    if(!response.ok){
        throw new Error(url + " HTTP " + response.status);
    }

    return await response.json();
}


/* =====================================================
   LOAD EVERYTHING
   matches.json = obligatoire
   teams.json / leagues.json = facultatif
===================================================== */

async function loadEverything(){

    setLoading();

    try{

        /*
         * MATCHS NO ATAO VOALOHANY
         */

        const matchData = await fetchJSON(MATCHES_URL);

        if(Array.isArray(matchData)){
            matches = matchData;
        }else if(Array.isArray(matchData.matches)){
            matches = matchData.matches;
        }else{
            matches = [];
        }


        /*
         * TEAMS
         */

        teams = {};

        try{

            const teamData = await fetchJSON(TEAMS_URL);

            const result =
                Array.isArray(teamData)
                ? teamData
                : (teamData.results || []);

            result.forEach(team=>{
                if(team && team.id != null){
                    teams[String(team.id)] = team;
                }
            });

        }catch(error){

            console.warn(
                "teams.json non disponible:",
                error.message
            );

        }


        /*
         * LEAGUES
         */

        leagues = {};

        try{

            const leagueData = await fetchJSON(LEAGUES_URL);

            const result =
                Array.isArray(leagueData)
                ? leagueData
                : (leagueData.results || []);

            result.forEach(league=>{
                if(league && league.id != null){
                    leagues[String(league.id)] = league;
                }
            });

        }catch(error){

            console.warn(
                "leagues.json non disponible:",
                error.message
            );

        }


        /*
         * CLEAN + SORT
         */

        matches = matches
            .filter(m => m && m.event_date)
            .sort(
                (a,b)=>
                    new Date(a.event_date) -
                    new Date(b.event_date)
            );


        updateStats();
        render();

    }catch(error){

        console.error(error);

        document.getElementById("statusText").textContent =
            "Erreur de chargement";

        document.getElementById("stats").innerHTML = "";

        document.getElementById("matches").innerHTML = `
            <div class="error">
                <b>❌ Impossible de charger les matchs.</b>
                <br>
                <small>${escapeHTML(error.message)}</small>
                <br>
                <button onclick="loadEverything()">
                    Réessayer
                </button>
            </div>
        `;

    }

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(){

    document.getElementById("statusText").textContent =
        "Chargement des données...";

    document.getElementById("stats").innerHTML = "";

    document.getElementById("matches").innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            <div>Chargement des matchs...</div>
        </div>
    `;

}


/* =====================================================
   STATUS ENGINE
===================================================== */

function getStatus(match){

    const raw =
        String(match.status || "")
        .toLowerCase()
        .trim();


    /*
     * STATUS EXPLICITE LIVE
     */

    const liveStatuses = [
        "live",
        "inplay",
        "in_play",
        "playing",
        "progress",
        "in progress",
        "first_half",
        "second_half",
        "halftime",
        "half_time",
        "paused"
    ];

    if(liveStatuses.some(s=>raw.includes(s))){
        return "live";
    }


    /*
     * STATUS EXPLICITE FINISHED
     */

    const finishedStatuses = [
        "finished",
        "complete",
        "completed",
        "ended",
        "final",
        "ft",
        "after"
    ];

    if(finishedStatuses.some(s=>raw.includes(s))){
        return "finished";
    }


    /*
     * STATUS NOT STARTED
     */

    const upcomingStatuses = [
        "notstarted",
        "not_started",
        "scheduled",
        "upcoming",
        "pending",
        "tbd",
        "postponed"
    ];

    if(upcomingStatuses.some(s=>raw.includes(s))){

        /*
         * Fa raha efa tena lasa ny heure
         * dia tsy atao À venir.
         */

        const date = new Date(match.event_date);

        if(
            !isNaN(date.getTime()) &&
            date.getTime() <= Date.now()
        ){
            return "finished";
        }

        return "upcoming";
    }


    /*
     * CURRENT MINUTE = LIVE
     */

    if(
        match.current_minute !== null &&
        match.current_minute !== undefined &&
        match.current_minute !== ""
    ){
        return "live";
    }


    /*
     * SCORE + DATE
     */

    const hasHomeScore =
        match.home_score !== null &&
        match.home_score !== undefined &&
        match.home_score !== "";

    const hasAwayScore =
        match.away_score !== null &&
        match.away_score !== undefined &&
        match.away_score !== "";


    const date = new Date(match.event_date);


    /*
     * SCORE + current minute
     */

    if(hasHomeScore && hasAwayScore){

        if(
            !isNaN(date.getTime()) &&
            date.getTime() > Date.now()
        ){
            return "upcoming";
        }

        /*
         * Raha tsy fantatra ny status
         * fa efa lasa ilay fotoana
         * dia Terminés.
         */

        return "finished";
    }


    /*
     * DATE ONLY
     */

    if(!isNaN(date.getTime())){

        if(date.getTime() > Date.now()){
            return "upcoming";
        }

        return "finished";
    }


    return "upcoming";
}


/* =====================================================
   FILTER
===================================================== */

function getFilteredMatches(){

    if(currentFilter === "all"){
        return matches;
    }

    return matches.filter(
        m=>getStatus(m) === currentFilter
    );
}


/* =====================================================
   FORMAT DATE
===================================================== */

function dateKey(date){

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:TZ,
            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    ).format(date);
}


function formatDay(date){

    return new Intl.DateTimeFormat(
        "fr-FR",
        {
            timeZone:TZ,
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    ).format(date);
}


function formatTime(date){

    return new Intl.DateTimeFormat(
        "fr-FR",
        {
            timeZone:TZ,
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        }
    ).format(date);
}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const live =
        matches.filter(
            m=>getStatus(m)==="live"
        ).length;

    const upcoming =
        matches.filter(
            m=>getStatus(m)==="upcoming"
        ).length;

    const finished =
        matches.filter(
            m=>getStatus(m)==="finished"
        ).length;


    document.getElementById("statusText").innerHTML =
        "<b>" + matches.length + "</b> matchs disponibles";


    document.getElementById("stats").innerHTML = `
        <div class="stat">🔴 Live : <b>${live}</b></div>
        <div class="stat">🕐 À venir : <b>${upcoming}</b></div>
        <div class="stat">✓ Terminés : <b>${finished}</b></div>
    `;
}


/* =====================================================
   TEAM DATA
===================================================== */

function getTeam(match,side){

    const id =
        side === "home"
        ? match.home_team_id
        : match.away_team_id;

    const name =
        side === "home"
        ? match.home_team
        : match.away_team;


    return teams[String(id)] || {
        id:id,
        name:name || "Équipe"
    };
}


/* =====================================================
   LOGO
===================================================== */

function getLogo(team){

    if(!team){
        return null;
    }

    const candidates = [
        team.logo,
        team.logo_url,
        team.image,
        team.image_url,
        team.crest,
        team.crest_url,
        team.badge,
        team.badge_url,
        team.logo_path
    ];


    for(const item of candidates){

        if(
            typeof item === "string" &&
            item.trim() !== ""
        ){
            return item.trim();
        }

    }


    return null;
}


/* =====================================================
   INITIALS
===================================================== */

function initials(name){

    const words =
        String(name || "FC")
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if(words.length >= 2){
        return (
            words[0][0] +
            words[words.length-1][0]
        ).toUpperCase();
    }

    return words[0]
        ? words[0].substring(0,2).toUpperCase()
        : "FC";
}


/* =====================================================
   LOGO HTML
===================================================== */

function renderLogo(team){

    const logo = getLogo(team);

    const text =
        escapeHTML(
            team?.name || "FC"
        );


    if(logo){

        return `
            <img
                class="logo"
                src="${escapeAttribute(logo)}"
                alt="${text}"
                loading="lazy"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
            >
            <div
                class="logo-fallback"
                style="display:none"
            >
                ${escapeHTML(initials(team?.name))}
            </div>
        `;

    }


    /*
     * API-nao tsy misy logo.
     * Aseho ny initiales fa tsy avatar sandoka.
     */

    return `
        <div class="logo-fallback">
            ${escapeHTML(initials(team?.name))}
        </div>
    `;
}


/* =====================================================
   LEAGUE
===================================================== */

function getLeague(match){

    const id =
        match.league_id != null
        ? String(match.league_id)
        : "unknown";

    return leagues[id] || {
        id:match.league_id,
        name:
            match.league_name ||
            match.competition ||
            "Football",
        country:
            match.country ||
            ""
    };
}


/* =====================================================
   MATCH RENDER
===================================================== */

function renderMatch(match){

    const status = getStatus(match);

    const date = new Date(match.event_date);

    const home = getTeam(match,"home");
    const away = getTeam(match,"away");

    const homeName =
        home.name ||
        match.home_team ||
        "Home";

    const awayName =
        away.name ||
        match.away_team ||
        "Away";


    let centerHTML = "";


    if(status === "upcoming"){

        centerHTML = `
            <div class="center">
                <div class="score vs">VS</div>
            </div>
        `;

    }else{

        const hs =
            match.home_score ??
            "-";

        const as =
            match.away_score ??
            "-";


        centerHTML = `
            <div class="center">

                <div class="score">
                    ${escapeHTML(hs)}
                    -
                    ${escapeHTML(as)}
                </div>

                ${
                    status === "live" &&
                    match.current_minute != null
                    ?
                    `<div class="minute">
                        ${escapeHTML(match.current_minute)}'
                    </div>`
                    :
                    ""
                }

            </div>
        `;
    }


    let badge = "";

    if(status === "live"){

        badge = `
            <span class="badge live">
                🔴 LIVE
            </span>
        `;

    }else if(status === "finished"){

        badge = `
            <span class="badge finished">
                ✓ Terminé
            </span>
        `;

    }else{

        badge = `
            <span class="badge upcoming">
                🕐 À venir
            </span>
        `;
    }


    return `
        <article class="match">

            <div class="match-top">

                <div class="match-time">
                    ${formatTime(date)}
                </div>

                <div>
                    ${badge}
                </div>

            </div>


            <div class="teams">

                <div class="team home">

                    <div class="team-name">
                        ${escapeHTML(homeName)}
                    </div>

                    ${renderLogo(home)}

                </div>


                ${centerHTML}


                <div class="team away">

                    ${renderLogo(away)}

                    <div class="team-name">
                        ${escapeHTML(awayName)}
                    </div>

                </div>

            </div>


            ${
                match.round_name
                ?
                `
                <div class="match-info">
                    ${escapeHTML(match.round_name)}
                </div>
                `
                :
                ""
            }

        </article>
    `;
}


/* =====================================================
   MAIN RENDER
===================================================== */

function render(){

    const container =
        document.getElementById("matches");

    const filtered =
        getFilteredMatches();


    if(filtered.length === 0){

        container.innerHTML = `
            <div class="empty">
                <div style="font-size:28px;margin-bottom:8px">
                    ⚽
                </div>
                Aucun match dans cette catégorie.
            </div>
        `;

        return;
    }


    /*
     * GROUP BY DAY
     */

    const days = {};


    filtered.forEach(match=>{

        const date =
            new Date(match.event_date);

        if(isNaN(date.getTime())){
            return;
        }

        const key =
            dateKey(date);

        if(!days[key]){
            days[key] = [];
        }

        days[key].push(match);
    });


    let html = "";


    Object.keys(days)
        .sort()
        .forEach(dayKey=>{

            const dayMatches =
                days[dayKey];


            /*
             * GROUP BY LEAGUE
             */

            const leagueGroups = {};


            dayMatches.forEach(match=>{

                const id =
                    match.league_id != null
                    ? String(match.league_id)
                    : "unknown";


                if(!leagueGroups[id]){
                    leagueGroups[id] = [];
                }

                leagueGroups[id].push(match);
            });


            const firstDate =
                new Date(
                    dayMatches[0].event_date
                );


            html += `
                <section class="day">

                    <div class="day-title">
                        ${escapeHTML(formatDay(firstDate))}
                    </div>
            `;


            Object.keys(leagueGroups)
                .sort((a,b)=>{

                    const la =
                        getLeague(
                            leagueGroups[a][0]
                        ).name || "";

                    const lb =
                        getLeague(
                            leagueGroups[b][0]
                        ).name || "";

                    return la.localeCompare(lb);
                })
                .forEach(leagueId=>{

                    const group =
                        leagueGroups[leagueId];

                    const league =
                        getLeague(group[0]);


                    html += `
                        <section class="league">

                            <div class="league-header">

                                <div class="league-left">

                                    <div class="league-icon">
                                        🏆
                                    </div>

                                    <div style="min-width:0">

                                        <div class="league-name">
                                            ${escapeHTML(
                                                league.name ||
                                                "Football"
                                            )}
                                        </div>

                                        ${
                                            league.country
                                            ?
                                            `
                                            <div class="league-country">
                                                ${escapeHTML(
                                                    league.country
                                                )}
                                            </div>
                                            `
                                            :
                                            ""
                                        }

                                    </div>

                                </div>

                                <div class="league-count">
                                    ${group.length} match${group.length > 1 ? "s":""}
                                </div>

                            </div>
                    `;


                    group.forEach(match=>{
                        html += renderMatch(match);
                    });


                    html += `
                        </section>
                    `;
                });


            html += `
                </section>
            `;
        });


    container.innerHTML = html;
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


/* =====================================================
   TABS
===================================================== */

document
    .querySelectorAll(".tab")
    .forEach(button=>{

        button.addEventListener("click",()=>{

            document
                .querySelectorAll(".tab")
                .forEach(b=>{
                    b.classList.remove("active");
                });

            button.classList.add("active");

            currentFilter =
                button.dataset.filter;

            render();

        });

    });


/* =====================================================
   START
===================================================== */

loadEverything();


/*
 * Auto refresh every 5 minutes
 */

setInterval(
    loadEverything,
    5 * 60 * 1000
);

</script>
