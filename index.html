<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Match Center</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f8;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#071d35,#0d3b66);
    color:white;
    padding:18px 14px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header-inner{
    max-width:900px;
    margin:auto;
}

.logo-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-ball{
    width:42px;
    height:42px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

h1{
    font-size:20px;
}

.subtitle{
    font-size:12px;
    opacity:.75;
    margin-top:3px;
}

.tabs{
    max-width:900px;
    margin:12px auto 0;
    display:flex;
    gap:7px;
    overflow-x:auto;
}

.tab{
    border:0;
    padding:9px 15px;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    color:white;
    white-space:nowrap;
    cursor:pointer;
    font-size:13px;
}

.tab.active{
    background:white;
    color:#0d3b66;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:12px 10px 50px;
}

.status{
    background:white;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    font-size:13px;
}

.loading{
    text-align:center;
    padding:30px;
}

.error{
    background:#ffe7e7;
    color:#a30000;
    padding:14px;
    border-radius:10px;
    margin:10px 0;
}

.day-title{
    font-size:14px;
    font-weight:bold;
    margin:18px 3px 8px;
    color:#334155;
}

.league{
    background:white;
    border-radius:13px;
    overflow:hidden;
    margin-bottom:12px;
    box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.league-header{
    background:#f8fafc;
    padding:11px 13px;
    border-bottom:1px solid #e8edf2;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.league-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
    font-size:14px;
}

.league-country{
    color:#7b8794;
    font-size:11px;
    margin-top:2px;
}

.league-badge{
    width:30px;
    height:30px;
    border-radius:8px;
    background:#e8eef5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
}

.match{
    padding:12px;
    border-bottom:1px solid #edf0f3;
    position:relative;
}

.match:last-child{
    border-bottom:0;
}

.match-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.time{
    font-size:12px;
    font-weight:bold;
    color:#475569;
}

.live{
    color:#e11d48;
    font-weight:bold;
}

.finished{
    color:#64748b;
}

.upcoming{
    color:#0f766e;
}

.minute{
    font-size:11px;
    color:#e11d48;
    font-weight:bold;
}

.teams{
    display:grid;
    grid-template-columns:1fr 52px 1fr;
    align-items:center;
    gap:8px;
}

.team{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
}

.team.home{
    justify-content:flex-end;
    text-align:right;
}

.team.away{
    justify-content:flex-start;
    text-align:left;
}

.team-name{
    font-size:13px;
    font-weight:600;
    line-height:1.2;
}

.team-logo{
    width:38px;
    height:38px;
    object-fit:contain;
    flex:none;
}

.logo-fallback{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#e8edf3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    color:#64748b;
    flex:none;
}

.score{
    text-align:center;
    font-size:19px;
    font-weight:800;
}

.vs{
    color:#94a3b8;
    font-size:13px;
    font-weight:bold;
}

.match-info{
    margin-top:8px;
    text-align:center;
    color:#94a3b8;
    font-size:10px;
}

.empty{
    background:white;
    padding:30px 15px;
    border-radius:12px;
    text-align:center;
    color:#64748b;
}

.refresh{
    border:0;
    background:#0d3b66;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    margin-top:8px;
    cursor:pointer;
}

@media(max-width:500px){

    header{
        padding:14px 10px;
    }

    h1{
        font-size:18px;
    }

    .container{
        padding:8px 7px 40px;
    }

    .teams{
        grid-template-columns:1fr 45px 1fr;
    }

    .team-name{
        font-size:12px;
    }

    .team-logo,
    .logo-fallback{
        width:34px;
        height:34px;
    }

    .score{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header>

<div class="header-inner">

<div class="logo-title">
<div class="logo-ball">⚽</div>

<div>
<h1>Football Match Center</h1>
<div class="subtitle">
Résultats • Live • Matchs à venir
</div>
</div>
</div>

<div class="tabs">

<button class="tab active" data-filter="all">
Tous
</button>

<button class="tab" data-filter="live">
🔴 Live
</button>

<button class="tab" data-filter="upcoming">
🕐 À venir
</button>

<button class="tab" data-filter="finished">
✓ Terminés
</button>

</div>

</div>

</header>


<main class="container">

<div id="status" class="status">
Chargement des matchs...
</div>

<div id="matches">
<div class="loading">
⏳ Chargement...
</div>
</div>

</main>


<script>

const MATCHES_URL = "./matches.json";
const TEAMS_URL = "./teams.json";
const LEAGUES_URL = "./leagues.json";

let matches = [];
let teams = {};
let leagues = {};

let currentFilter = "all";


/* =========================
   LOAD JSON
========================= */

async function loadJSON(url){

    const response = await fetch(
        url + "?v=" + Date.now(),
        {
            cache:"no-store"
        }
    );

    if(!response.ok){
        throw new Error(
            url + " HTTP " + response.status
        );
    }

    return await response.json();
}


/* =========================
   INIT
========================= */

async function init(){

    try{

        const [matchData,teamData,leagueData] =
            await Promise.all([
                loadJSON(MATCHES_URL),
                loadJSON(TEAMS_URL),
                loadJSON(LEAGUES_URL)
            ]);


        /*
         * MATCHES
         */

        matches =
            Array.isArray(matchData)
            ? matchData
            : (matchData.matches || []);


        /*
         * TEAMS
         */

        const teamResults =
            Array.isArray(teamData)
            ? teamData
            : (teamData.results || []);


        teamResults.forEach(team=>{
            teams[String(team.id)] = team;
        });


        /*
         * LEAGUES
         */

        const leagueResults =
            Array.isArray(leagueData)
            ? leagueData
            : (leagueData.results || []);


        leagueResults.forEach(league=>{
            leagues[String(league.id)] = league;
        });


        /*
         * SORT MATCHES
         */

        matches.sort((a,b)=>{

            const da =
                new Date(
                    a.event_date || a.start_date || 0
                );

            const db =
                new Date(
                    b.event_date || b.start_date || 0
                );

            return da-db;

        });


        updateStatus();

        render();

    }catch(error){

        console.error(error);

        document.getElementById("status").innerHTML =
            "❌ Impossible de charger les données.<br><small>"
            + error.message +
            "</small>";

        document.getElementById("matches").innerHTML = "";

    }

}


/* =========================
   MATCH STATUS
========================= */

function getMatchStatus(match){

    const status =
        String(match.status || "").toLowerCase();


    if(
        status.includes("live") ||
        status.includes("progress") ||
        status.includes("playing") ||
        status.includes("inplay")
    ){
        return "live";
    }


    if(
        status.includes("finished") ||
        status.includes("complete") ||
        status.includes("ended") ||
        status.includes("final")
    ){
        return "finished";
    }


    /*
     * Score + status unknown
     */

    if(
        match.home_score !== null &&
        match.home_score !== undefined &&
        match.away_score !== null &&
        match.away_score !== undefined
    ){

        /*
         * Raha manana minute/current period
         * dia azo heverina ho live
         */

        if(
            match.current_minute !== null &&
            match.current_minute !== undefined
        ){
            return "live";
        }

    }


    /*
     * DATE CHECK
     */

    const date =
        new Date(match.event_date);


    if(
        !isNaN(date.getTime()) &&
        date.getTime() < Date.now()
    ){

        /*
         * Match efa lasa tsy tokony hiditra
         * ao amin'ny A VENIR
         */

        return "finished";

    }


    return "upcoming";

}


/* =========================
   TIME
========================= */

function formatDate(date){

    return new Intl.DateTimeFormat(
        "fr-FR",
        {
            timeZone:"Indian/Antananarivo",
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    ).format(date);

}


function formatTime(date){

    return new Intl.DateTimeFormat(
        "fr-FR",
        {
            timeZone:"Indian/Antananarivo",
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        }
    ).format(date);

}


/* =========================
   LOGO
========================= */

function teamLogo(team){

    if(!team) return null;

    /*
     * Raha misy logo amin'ny API amin'ny ho avy
     * dia ho raisina automatique
     */

    const possible =
        team.logo ||
        team.logo_url ||
        team.image ||
        team.image_url ||
        team.crest ||
        team.crest_url ||
        team.badge ||
        team.badge_url;


    if(possible){
        return possible;
    }


    /*
     * Raha tsy misy logo ao amin'ny API,
     * mampiasa service logo mifototra amin'ny
     * anaran'ny équipe.
     */

    const name =
        encodeURIComponent(
            team.name || ""
        );


    if(name){

        return "https://ui-avatars.com/api/?name="
            + name
            + "&background=e8edf3&color=334155&bold=true&size=128";

    }


    return null;

}


/* =========================
   LOGO HTML
========================= */

function renderLogo(team){

    const logo =
        teamLogo(team);


    if(logo){

        return `
            <img
                class="team-logo"
                src="${logo}"
                alt=""
                loading="lazy"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
            >
            <div class="logo-fallback" style="display:none">
                ⚽
            </div>
        `;

    }


    return `
        <div class="logo-fallback">
            ⚽
        </div>
    `;

}


/* =========================
   STATUS LABEL
========================= */

function statusLabel(match,status){

    if(status==="live"){

        let minute =
            match.current_minute;

        if(
            minute !== null &&
            minute !== undefined &&
            minute !== ""
        ){

            return `
                <span class="live">
                    🔴 LIVE
                </span>
                <span class="minute">
                    ${minute}'
                </span>
            `;

        }

        return `
            <span class="live">
                🔴 LIVE
            </span>
        `;

    }


    if(status==="finished"){

        return `
            <span class="finished">
                ✓ Terminé
            </span>
        `;

    }


    return `
        <span class="upcoming">
            🕐 À venir
        </span>
    `;

}


/* =========================
   FILTER
========================= */

function filterMatches(){

    return matches.filter(match=>{

        const status =
            getMatchStatus(match);


        if(currentFilter==="all")
            return true;


        return status===currentFilter;

    });

}


/* =========================
   RENDER
========================= */

function render(){

    const container =
        document.getElementById("matches");


    const filtered =
        filterMatches();


    if(filtered.length===0){

        container.innerHTML = `
            <div class="empty">
                Aucun match disponible.
            </div>
        `;

        return;

    }


    /*
     * GROUP BY DAY
     */

    const days = {};


    filtered.forEach(match=>{

        const date =
            new Date(match.event_date);


        if(isNaN(date.getTime()))
            return;


        const dayKey =
            date.toLocaleDateString(
                "en-CA",
                {
                    timeZone:"Indian/Antananarivo"
                }
            );


        if(!days[dayKey])
            days[dayKey]=[];


        days[dayKey].push(match);

    });


    let html="";


    Object.keys(days)
        .sort()
        .forEach(dayKey=>{

            const dayMatches =
                days[dayKey];


            const dayDate =
                new Date(
                    dayMatches[0].event_date
                );


            html += `
                <div class="day-title">
                    ${formatDate(dayDate)}
                </div>
            `;


            /*
             * GROUP BY LEAGUE
             */

            const leagueGroups={};


            dayMatches.forEach(match=>{

                const id =
                    String(
                        match.league_id ?? "unknown"
                    );


                if(!leagueGroups[id])
                    leagueGroups[id]=[];


                leagueGroups[id].push(match);

            });


            Object.keys(leagueGroups)
                .forEach(leagueId=>{

                    const league =
                        leagues[leagueId];


                    const leagueName =
                        league?.name ||
                        matchLeagueName(
                            leagueGroups[leagueId][0]
                        );


                    const country =
                        league?.country || "";


                    html += `
                        <section class="league">

                            <div class="league-header">

                                <div class="league-name">

                                    <div class="league-badge">
                                        🏆
                                    </div>

                                    <div>
                                        <div>
                                            ${escapeHTML(leagueName)}
                                        </div>

                                        ${
                                            country
                                            ? `<div class="league-country">
                                                ${escapeHTML(country)}
                                              </div>`
                                            : ""
                                        }

                                    </div>

                                </div>

                                <div>
                                    ⚽
                                </div>

                            </div>
                    `;


                    leagueGroups[leagueId]
                        .forEach(match=>{

                            html += renderMatch(match);

                        });


                    html += `
                        </section>
                    `;

                });

        });


    container.innerHTML=html;

}


/* =========================
   MATCH CARD
========================= */

function renderMatch(match){

    const status =
        getMatchStatus(match);


    const date =
        new Date(match.event_date);


    const home =
        teams[String(match.home_team_id)] ||
        {
            id:match.home_team_id,
            name:match.home_team || "Home"
        };


    const away =
        teams[String(match.away_team_id)] ||
        {
            id:match.away_team_id,
            name:match.away_team || "Away"
        };


    const homeName =
        home.name ||
        match.home_team ||
        "Home";


    const awayName =
        away.name ||
        match.away_team ||
        "Away";


    let center;


    if(
        status==="upcoming"
    ){

        center=`
            <div class="score vs">
                VS
            </div>
        `;

    }else{

        const hs =
            match.home_score ??
            "-";


        const as =
            match.away_score ??
            "-";


        center=`
            <div class="score">
                ${hs} - ${as}
            </div>
        `;

    }


    return `
        <article class="match">

            <div class="match-top">

                <div class="time">
                    ${formatTime(date)}
                </div>

                <div>
                    ${statusLabel(match,status)}
                </div>

            </div>


            <div class="teams">

                <div class="team home">

                    <div class="team-name">
                        ${escapeHTML(homeName)}
                    </div>

                    ${renderLogo(home)}

                </div>


                ${center}


                <div class="team away">

                    ${renderLogo(away)}

                    <div class="team-name">
                        ${escapeHTML(awayName)}
                    </div>

                </div>

            </div>


            <div class="match-info">

                ${
                    match.round_name
                    ? escapeHTML(match.round_name)
                    : ""
                }

            </div>

        </article>
    `;

}


/* =========================
   LEAGUE FALLBACK
========================= */

function matchLeagueName(match){

    return (
        match.league_name ||
        match.competition ||
        "Football"
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   STATUS
========================= */

function updateStatus(){

    const live =
        matches.filter(
            m=>getMatchStatus(m)==="live"
        ).length;


    const upcoming =
        matches.filter(
            m=>getMatchStatus(m)==="upcoming"
        ).length;


    const finished =
        matches.filter(
            m=>getMatchStatus(m)==="finished"
        ).length;


    document.getElementById("status").innerHTML = `
        <b>${matches.length}</b> matchs disponibles
        · 🔴 ${live} Live
        · 🕐 ${upcoming} À venir
        · ✓ ${finished} Terminés
        <br>

        <button
            class="refresh"
            onclick="location.reload()"
        >
            🔄 Actualiser
        </button>
    `;

}


/* =========================
   TABS
========================= */

document.querySelectorAll(".tab")
.forEach(button=>{

    button.addEventListener(
        "click",
        ()=>{

            document
                .querySelectorAll(".tab")
                .forEach(
                    b=>b.classList.remove("active")
                );


            button.classList.add("active");


            currentFilter =
                button.dataset.filter;


            render();

        }
    );

});


/* =========================
   START
========================= */

init();


/*
 * Auto refresh every 5 minutes
 */

setInterval(
    ()=>location.reload(),
    5 * 60 * 1000
);

</script>

</body>
</html>
