<body>

<header>
<div class="header">

<div class="brand">
<div class="ball">⚽</div>
<div>
<h1>Football Match Center</h1>
<div class="sub">Live • Résultats • Matchs à venir • Prédictions</div>
</div>
</div>

<div class="tabs">
<button class="tab active" data-filter="all">Tous</button>
<button class="tab" data-filter="live">🔴 Live</button>
<button class="tab" data-filter="upcoming">🕐 À venir</button>
<button class="tab" data-filter="finished">✓ Terminés</button>
</div>

</div>
</header>

<main class="container">

<div id="status" class="status">
<div class="loading">Chargement des matchs...</div>
</div>

<div id="matches">
<div class="loading">⏳ Chargement...</div>
</div>

</main>

<script>

const MATCHES_URL="./matches.json";
const TEAMS_URL="./teams.json";
const LEAGUES_URL="./leagues.json";

let matches=[];
let teams={};
let leagues={};
let currentFilter="all";


/* =========================
   LOAD
========================= */

async function loadJSON(url){

const r=await fetch(url+"?v="+Date.now(),{
cache:"no-store"
});

if(!r.ok)
throw new Error(url+" HTTP "+r.status);

return await r.json();
}


/* =========================
   INIT
========================= */

async function init(){

try{

const [matchData,teamData,leagueData]=await Promise.all([
loadJSON(MATCHES_URL),
loadJSON(TEAMS_URL),
loadJSON(LEAGUES_URL)
]);

matches=Array.isArray(matchData)
?matchData
:(matchData.matches||[]);

const teamResults=Array.isArray(teamData)
?teamData
:(teamData.results||[]);

teamResults.forEach(t=>{
teams[String(t.id)]=t;
});

const leagueResults=Array.isArray(leagueData)
?leagueData
:(leagueData.results||[]);

leagueResults.forEach(l=>{
leagues[String(l.id)]=l;
});

matches.sort((a,b)=>{
return new Date(a.event_date||a.start_date||0)
-
new Date(b.event_date||b.start_date||0);
});

updateStatus();
render();

}catch(e){

console.error(e);

document.getElementById("status").innerHTML=
`<div class="error">
❌ Impossible de charger les données.<br>
<small>${escapeHTML(e.message)}</small>
</div>`;

document.getElementById("matches").innerHTML="";

}

}


/* =========================
   STATUS
========================= */

function getStatus(m){

const s=String(m.status||"").toLowerCase();

if(
s.includes("live")||
s.includes("progress")||
s.includes("playing")||
s.includes("inplay")
)return "live";

if(
s.includes("finished")||
s.includes("complete")||
s.includes("ended")||
s.includes("final")
)return "finished";

if(
m.current_minute!==undefined &&
m.current_minute!==null &&
m.current_minute!==""
)return "live";

const d=new Date(m.event_date);

if(!isNaN(d)&&d.getTime()<Date.now())
return "finished";

return "upcoming";
}


/* =========================
   ELO ENGINE
========================= */

function num(v){

const n=parseFloat(v);

return Number.isFinite(n)?n:null;
}

function buildRatings(){

const rating={};

matches
.filter(m=>getStatus(m)==="finished")
.forEach(m=>{

const h=String(m.home_team_id||"");
const a=String(m.away_team_id||"");

const hs=num(m.home_score);
const as=num(m.away_score);

if(!h||!a||hs===null||as===null)return;

if(rating[h]===undefined)rating[h]=1500;
if(rating[a]===undefined)rating[a]=1500;

const rh=rating[h];
const ra=rating[a];

const expectedHome=
1/(1+Math.pow(10,(ra-rh-55)/400));

let result=0.5;

if(hs>as)result=1;
if(hs<as)result=0;

let k=24;

const diff=Math.abs(hs-as);

if(diff>=2)k=28;

rating[h]=rh+k*(result-expectedHome);
rating[a]=ra+k*((1-result)-(1-expectedHome));

});

return rating;
}


/* =========================
   PREDICTION ENGINE
========================= */

function predict(match){

const ratings=buildRatings();

const hid=String(match.home_team_id||"");
const aid=String(match.away_team_id||"");

const homeRating=ratings[hid]??1500;
const awayRating=ratings[aid]??1500;

const difference=(homeRating+55)-awayRating;

const homeWin=1/(1+Math.pow(10,-difference/400));

/*
 * Draw probability
 * Approximation based on Elo gap
 */

let draw=0.28-Math.min(Math.abs(difference)/1000,0.12);

if(draw<0.16)draw=0.16;

let hprob=homeWin*(1-draw);
let aprob=(1-homeWin)*(1-draw);

const total=hprob+draw+aprob;

hprob/=total;
draw/=total;
aprob/=total;


/* Finished goals */

let goals=2.5;
let bttsProb=0.50;

const finished=matches.filter(m=>{

if(getStatus(m)!=="finished")return false;

const hs=num(m.home_score);
const as=num(m.away_score);

return hs!==null&&as!==null;

});

if(finished.length){

let totalGoals=0;
let btts=0;

finished.forEach(m=>{

const hs=num(m.home_score);
const as=num(m.away_score);

totalGoals+=hs+as;

if(hs>0&&as>0)btts++;

});

goals=Math.max(
1.8,
Math.min(
4.2,
totalGoals/finished.length
)
);

bttsProb=btts/finished.length;

}


/* Team strength influences goals */

const strength=(difference/400);

let expectedHome=
goals/2 + strength*0.65;

let expectedAway=
goals/2 - strength*0.45;

expectedHome=Math.max(0.35,Math.min(3.8,expectedHome));
expectedAway=Math.max(0.25,Math.min(3.2,expectedAway));


/* Score */

const homeScore=Math.max(
0,
Math.min(
5,
Math.round(expectedHome)
)
);

const awayScore=Math.max(
0,
Math.min(
5,
Math.round(expectedAway)
)
);


/* 1X2 */

let main;

if(hprob>=draw&&hprob>=aprob)
main="Victoire "+teamName(match.home_team_id,match.home_team);

else if(aprob>=hprob&&aprob>=draw)
main="Victoire "+teamName(match.away_team_id,match.away_team);

else
main="Match nul";


/* Double chance */

let dc;

if(hprob>=aprob)
dc="1X";

else
dc="X2";


/* Over */

const over25=
goals>=2.55
?"Over 2.5"
:"Under 2.5";


/* BTTS */

const btts=
bttsProb>=0.52
?"Oui"
:"Non";


let confidence=
Math.max(hprob,draw,aprob)*100;

confidence=
Math.round(
Math.min(89,Math.max(51,confidence))
);


return{
main,
dc,
over25,
btts,
score:`${homeScore} - ${awayScore}`,
confidence,
hprob:Math.round(hprob*100),
draw:Math.round(draw*100),
aprob:Math.round(aprob*100)
};

}


/* =========================
   TEAM NAME
========================= */

function teamName(id,fallback){

const t=teams[String(id)];

return t?.name||fallback||"Équipe";
}


/* =========================
   LOGO / INITIALS
========================= */

function initials(name){

return String(name||"FC")
.split(/\s+/)
.filter(Boolean)
.slice(0,2)
.map(x=>x[0])
.join("")
.toUpperCase();

}

function logo(team){

return `
<div class="logo">
${escapeHTML(initials(team?.name))}
</div>
`;

}


/* =========================
   DATE
========================= */

function formatDate(d){

return new Intl.DateTimeFormat("fr-FR",{
timeZone:"Indian/Antananarivo",
weekday:"long",
day:"2-digit",
month:"long",
year:"numeric"
}).format(d);

}

function formatTime(d){

return new Intl.DateTimeFormat("fr-FR",{
timeZone:"Indian/Antananarivo",
hour:"2-digit",
minute:"2-digit",
hour12:false
}).format(d);

}


/* =========================
   FILTER
========================= */

function filteredMatches(){

return matches.filter(m=>{

if(currentFilter==="all")return true;

return getStatus(m)===currentFilter;

});

}


/* =========================
   RENDER
========================= */

function render(){

const list=filteredMatches();
const container=document.getElementById("matches");

if(!list.length){

container.innerHTML=
`<div class="empty">Aucun match disponible.</div>`;

return;
}

const days={};

list.forEach(m=>{

const d=new Date(m.event_date);

if(isNaN(d))return;

const key=d.toLocaleDateString("en-CA",{
timeZone:"Indian/Antananarivo"
});

if(!days[key])days[key]=[];

days[key].push(m);

});


let html="";

Object.keys(days)
.sort()
.forEach(day=>{

const dayMatches=days[day];

html+=`
<div class="day">
${formatDate(new Date(dayMatches[0].event_date))}
</div>
`;

const groups={};

dayMatches.forEach(m=>{

const id=String(m.league_id??"unknown");

if(!groups[id])groups[id]=[];

groups[id].push(m);

});


Object.keys(groups).forEach(id=>{

const group=groups[id];

const league=leagues[id];

const name=
league?.name||
group[0].league_name||
group[0].competition||
"Football";

const country=league?.country||"";

html+=`
<section class="league">

<div class="league-head">

<div class="league-title">

<div class="trophy">🏆</div>

<div>
<div class="league-name">
${escapeHTML(name)}
</div>

<div class="country">
${escapeHTML(country)}
</div>
</div>

</div>

<div class="count">
${group.length} match${group.length>1?"s":""}
</div>

</div>
`;

group.forEach(m=>{
html+=renderMatch(m);
});

html+=`</section>`;

});

});

container.innerHTML=html;

}


/* =========================
   MATCH
========================= */

function renderMatch(m){

const status=getStatus(m);
const date=new Date(m.event_date);

const home=teams[String(m.home_team_id)]||{
name:m.home_team||"Home"
};

const away=teams[String(m.away_team_id)]||{
name:m.away_team||"Away"
};

const homeName=teamName(m.home_team_id,home.name);
const awayName=teamName(m.away_team_id,away.name);

let center="VS";

if(status!=="upcoming"){

center=
`${m.home_score??"-"} - ${m.away_score??"-"}`;

}

let badge="🕐 À venir";
let badgeClass="upcoming";

if(status==="live"){
badge="🔴 LIVE";
badgeClass="live";
}

if(status==="finished"){
badge="✓ Terminé";
badgeClass="finished";
}

let prediction="";

if(status==="upcoming"||status==="live"){

const p=predict(m);

prediction=`

<div class="prediction">

<div class="pred-head">

<div class="pred-title">
🔮 PRÉDICTION
</div>

<div class="conf">
${p.confidence}% confiance
</div>

</div>

<div class="pred-body">

<div class="main-pred">

<div class="main-label">
PRONOSTIC PRINCIPAL
</div>

<div class="main-value">
${escapeHTML(p.main)}
</div>

</div>

<div class="pred-grid">

<div class="pred-item">
<span>1X2</span>
<b>
1: ${p.hprob}% · X: ${p.draw}% · 2: ${p.aprob}%
</b>
</div>

<div class="pred-item">
<span>DOUBLE CHANCE</span>
<b>${p.dc}</b>
</div>

<div class="pred-item">
<span>BUTS 2.5</span>
<b>${p.over25}</b>
</div>

<div class="pred-item">
<span>BTTS</span>
<b>${p.btts}</b>
</div>

<div class="pred-item">
<span>SCORE PROBABLE</span>
<b>${p.score}</b>
</div>

<div class="pred-item">
<span>ALGORITHME</span>
<b>ELO + résultats</b>
</div>

</div>

</div>

</div>

`;

}

return`

<article class="match">

<div class="match-top">

<div class="time">
${formatTime(date)}
</div>

<div class="badge ${badgeClass}">
${badge}
</div>

</div>

<div class="teams">

<div class="team home">

<div class="team-name">
${escapeHTML(homeName)}
</div>

${logo(home)}

</div>

<div class="center ${status!=="upcoming"?"score":""}">
${center}
</div>

<div class="team away">

${logo(away)}

<div class="team-name">
${escapeHTML(awayName)}
</div>

</div>

</div>

<div class="round">
${escapeHTML(m.round_name||"")}
</div>

${prediction}

</article>

`;

}


/* =========================
   STATUS BAR
========================= */

function updateStatus(){

const live=matches.filter(m=>getStatus(m)==="live").length;
const upcoming=matches.filter(m=>getStatus(m)==="upcoming").length;
const finished=matches.filter(m=>getStatus(m)==="finished").length;

document.getElementById("status").innerHTML=`

<button class="refresh" onclick="location.reload()">
↻
</button>

<div class="status-main">
${matches.length} matchs disponibles
</div>

<div class="stats">

<div class="stat">🔴 Live : <b>${live}</b></div>

<div class="stat">🕐 À venir : <b>${upcoming}</b></div>

<div class="stat">✓ Terminés : <b>${finished}</b></div>

</div>

`;

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   TABS
========================= */

document.querySelectorAll(".tab").forEach(btn=>{

btn.addEventListener("click",()=>{

document.querySelectorAll(".tab")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

currentFilter=btn.dataset.filter;

render();

});

});


/* START */

init();


/* AUTO UPDATE */

setInterval(()=>{
location.reload();
},5*60*1000);

</script>

</body>
</html>
