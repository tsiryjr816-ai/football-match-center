<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Match Center</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #07111f;
  color: white;
}

.header {
  padding: 20px 16px;
  background: linear-gradient(135deg, #0d2744, #0b1728);
  text-align: center;
  border-bottom: 1px solid #1d3b5d;
}

.logo {
  font-size: 25px;
  font-weight: 800;
}

.subtitle {
  color: #91a8bf;
  font-size: 13px;
  margin-top: 5px;
}

.date-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 15px;
  background: #0b192a;
  position: sticky;
  top: 0;
  z-index: 10;
}

.date-button {
  width: 45px;
  height: 45px;
  border: 0;
  border-radius: 12px;
  background: #163452;
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.date-button:active {
  transform: scale(.95);
}

.date-center {
  text-align: center;
  flex: 1;
}

.date-title {
  font-size: 18px;
  font-weight: bold;
}

.date-full {
  color: #8fa7bd;
  font-size: 12px;
  margin-top: 4px;
}

.stats {
  display: flex;
  gap: 8px;
  padding: 12px;
  overflow-x: auto;
}

.stat {
  min-width: 110px;
  padding: 12px;
  border-radius: 12px;
  background: #0d2035;
  border: 1px solid #183b5c;
  text-align: center;
}

.stat-number {
  font-size: 20px;
  font-weight: bold;
}

.stat-label {
  color: #8fa7bd;
  font-size: 11px;
}

.container {
  padding: 0 12px 30px;
}

.league {
  margin-top: 16px;
}

.league-title {
  padding: 12px;
  background: #102b46;
  border-radius: 10px 10px 0 0;
  font-weight: bold;
  font-size: 14px;
}

.match {
  display: grid;
  grid-template-columns: 55px 1fr 55px;
  align-items: center;
  gap: 8px;
  padding: 15px 10px;
  background: #0b1b2d;
  border-bottom: 1px solid #183149;
}

.time {
  color: #7fa0bd;
  font-size: 12px;
  text-align: center;
}

.teams {
  text-align: center;
}

.team {
  font-size: 14px;
  margin: 5px 0;
}

.vs {
  color: #5e7892;
  font-size: 10px;
}

.score {
  text-align: center;
  font-weight: bold;
  font-size: 15px;
}

.status {
  display: inline-block;
  margin-top: 5px;
  padding: 3px 7px;
  border-radius: 8px;
  font-size: 9px;
  background: #173a56;
  color: #9fc1dc;
}

.status.live {
  background: #7d1d29;
  color: #ffb5bc;
}

.status.finished {
  background: #1e5638;
  color: #a7e5be;
}

.empty {
  text-align: center;
  padding: 50px 20px;
  color: #7890a7;
}

.loading {
  text-align: center;
  padding: 50px;
  color: #9bb1c5;
}

.footer {
  text-align: center;
  color: #637d95;
  font-size: 11px;
  padding: 20px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">⚽ Football Match Center</div>
  <div class="subtitle">
    Fixtures & résultats automatiques
  </div>
</header>

<div class="date-bar">

  <button class="date-button" onclick="changeDay(-1)">
    ←
  </button>

  <div class="date-center">
    <div id="dateTitle" class="date-title">
      Chargement...
    </div>

    <div id="dateFull" class="date-full"></div>
  </div>

  <button class="date-button" onclick="changeDay(1)">
    →
  </button>

</div>

<div class="stats">

  <div class="stat">
    <div id="totalMatches" class="stat-number">0</div>
    <div class="stat-label">MATCHS</div>
  </div>

  <div class="stat">
    <div id="liveMatches" class="stat-number">0</div>
    <div class="stat-label">LIVE</div>
  </div>

  <div class="stat">
    <div id="finishedMatches" class="stat-number">0</div>
    <div class="stat-label">TERMINÉS</div>
  </div>

</div>

<main class="container">

  <div id="matches">
    <div class="loading">
      Chargement des matchs...
    </div>
  </div>

</main>

<div class="footer">
  Données mises à jour automatiquement
</div>

<script>

let allMatches = [];
let currentDate = new Date();

const MONTHS = [
  "janvier",
  "février",
  "mars",
  "avril",
  "mai",
  "juin",
  "juillet",
  "août",
  "septembre",
  "octobre",
  "novembre",
  "décembre"
];

function localDateString(date) {

  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

function formatDate(date) {

  const day = date.getDate();

  const month = MONTHS[date.getMonth()];

  const year = date.getFullYear();

  return `${day} ${month} ${year}`;
}

function changeDay(amount) {

  currentDate.setDate(
    currentDate.getDate() + amount
  );

  render();
}

function formatTime(dateString) {

  const date = new Date(dateString);

  return date.toLocaleTimeString(
    "fr-FR",
    {
      hour: "2-digit",
      minute: "2-digit",
      timeZone: "Indian/Antananarivo"
    }
  );
}

function getStatus(match) {

  const status =
    String(match.status || "").toLowerCase();

  if (
    status.includes("live") ||
    status.includes("progress")
  ) {
    return {
      text: "LIVE",
      className: "live"
    };
  }

  if (
    status.includes("finish") ||
    status.includes("complete")
  ) {
    return {
      text: "TERMINÉ",
      className: "finished"
    };
  }

  return {
    text: "À VENIR",
    className: ""
  };
}

function getScore(match) {

  /*
   * BSD mety mampiasa champs score samihafa
   * arakaraka ny match.
   */

  const home =
    match.home_score ??
    match.home_goals ??
    match.home_team_score;

  const away =
    match.away_score ??
    match.away_goals ??
    match.away_team_score;

  if (
    home !== null &&
    home !== undefined &&
    away !== null &&
    away !== undefined
  ) {
    return `${home} - ${away}`;
  }

  return "vs";
}

function render() {

  const selectedDate =
    localDateString(currentDate);

  document.getElementById("dateTitle").textContent =
    currentDate.toLocaleDateString(
      "fr-FR",
      { weekday: "long" }
    );

  document.getElementById("dateFull").textContent =
    formatDate(currentDate);

  const matches =
    allMatches.filter(match => {

      if (!match.event_date) {
        return false;
      }

      const date =
        new Date(match.event_date);

      const madagascarDate =
        new Intl.DateTimeFormat(
          "en-CA",
          {
            timeZone: "Indian/Antananarivo"
          }
        ).format(date);

      return madagascarDate === selectedDate;

    });

  document.getElementById("totalMatches").textContent =
    matches.length;

  const live =
    matches.filter(m =>
      String(m.status || "")
        .toLowerCase()
        .includes("live")
    ).length;

  const finished =
    matches.filter(m =>
      String(m.status || "")
        .toLowerCase()
        .includes("finish")
    ).length;

  document.getElementById("liveMatches").textContent =
    live;

  document.getElementById("finishedMatches").textContent =
    finished;

  const container =
    document.getElementById("matches");

  if (!matches.length) {

    container.innerHTML = `
      <div class="empty">
        ⚽<br><br>
        Aucun match trouvé pour cette date.
      </div>
    `;

    return;
  }

  matches.sort(
    (a, b) =>
      new Date(a.event_date) -
      new Date(b.event_date)
  );

  const grouped = {};

  matches.forEach(match => {

    const league =
      match.league_name ||
      match.competition_name ||
      `Compétition #${match.league_id || "?"}`;

    if (!grouped[league]) {
      grouped[league] = [];
    }

    grouped[league].push(match);

  });

  let html = "";

  Object.keys(grouped)
    .sort()
    .forEach(league => {

      html += `
        <section class="league">

          <div class="league-title">
            🏆 ${league}
          </div>
      `;

      grouped[league].forEach(match => {

        const status =
          getStatus(match);

        html += `
          <div class="match">

            <div class="time">
              ${formatTime(match.event_date)}
            </div>

            <div class="teams">

              <div class="team">
                ${escapeHtml(match.home_team || "Équipe inconnue")}
              </div>

              <div class="vs">VS</div>

              <div class="team">
                ${escapeHtml(match.away_team || "Équipe inconnue")}
              </div>

              <span class="status ${status.className}">
                ${status.text}
              </span>

            </div>

            <div class="score">
              ${getScore(match)}
            </div>

          </div>
        `;

      });

      html += `</section>`;

    });

  container.innerHTML = html;
}

function escapeHtml(text) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function loadMatches() {

  try {

    const response =
      await fetch(
        "matches.json?cache=" +
        Date.now()
      );

    if (!response.ok) {
      throw new Error(
        "Impossible de charger matches.json"
      );
    }

    const data =
      await response.json();

    allMatches =
      data.matches || [];

    render();

  } catch (error) {

    console.error(error);

    document.getElementById("matches").innerHTML = `
      <div class="empty">
        ❌ Impossible de charger les matchs.
      </div>
    `;

  }

}

loadMatches();

</script>

</body>
</html>
